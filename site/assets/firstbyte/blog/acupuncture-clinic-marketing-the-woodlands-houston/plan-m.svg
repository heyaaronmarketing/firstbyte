<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 636" width="440" height="636" role="img" aria-labelledby="t964486"><title id="t964486">Five-step 90-day marketing plan for an acupuncture clinic in The Woodlands and Houston</title><defs><linearGradient id="g964486" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar964486" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="635" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="635" rx="22" fill="url(#g964486)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A first 90 days for an</tspan><tspan x="36" dy="30">acupuncture clinic</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">In this order, each step making the next one</tspan><tspan x="36" dy="20">pay off</tspan></text><circle cx="58" cy="182" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="187" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="202" y2="240" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="187" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Weeks 1-2: fix the profile</text><text x="92" y="209" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Category, photos, services, booking</tspan><tspan x="92" dy="19">link, title audit everywhere.</tspan></text><circle cx="58" cy="268" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="273" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="288" y2="326" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="273" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Weeks 2-4: insurance and price page</text><text x="92" y="295" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Verification form, in-network list,</tspan><tspan x="92" dy="19">cash and package prices.</tspan></text><circle cx="58" cy="354" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="359" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="374" y2="412" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="359" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Weeks 3-6: five condition pages</text><text x="92" y="381" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Pain first, then fertility support</tspan><tspan x="92" dy="19">and stress, written carefully.</tspan></text><circle cx="58" cy="440" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="445" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="460" y2="498" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="445" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Weeks 4-8: reviews and referrals</text><text x="92" y="467" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Review text to every patient; visit</tspan><tspan x="92" dy="19">three chiropractors or PTs.</tspan></text><circle cx="58" cy="526" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="531" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="531" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Weeks 6-12: paid search</text><text x="92" y="553" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Condition ad groups, tight radius,</tspan><tspan x="92" dy="19">conversions on bookings.</tspan></text><text x="404" y="614" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>