<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 636" width="440" height="636" role="img" aria-labelledby="t305312"><title id="t305312">Five-step speed-to-lead routine for Houston contractors buying shared Angi and Thumbtack leads</title><defs><linearGradient id="g305312" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar305312" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="635" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="635" rx="22" fill="url(#g305312)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A speed-to-lead routine</tspan><tspan x="36" dy="30">for shared leads</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Set this up before you buy a single</tspan><tspan x="36" dy="20">marketplace lead</tspan></text><circle cx="58" cy="182" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="187" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="202" y2="240" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="187" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Route alerts to a person</text><text x="92" y="209" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Notifications go to a phone someone</tspan><tspan x="92" dy="19">carries during business hours.</tspan></text><circle cx="58" cy="268" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="273" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="288" y2="326" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="273" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Call within five minutes</text><text x="92" y="295" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">No answer? Text your name, company</tspan><tspan x="92" dy="19">and a link to your reviews.</tspan></text><circle cx="58" cy="354" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="359" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="374" y2="412" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="359" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Follow up twice</text><text x="92" y="381" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Call again that evening and the next</tspan><tspan x="92" dy="19">morning. Log every attempt.</tspan></text><circle cx="58" cy="440" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="445" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="460" y2="498" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="445" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Record the outcome</text><text x="92" y="467" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Reached, booked, sold or lost, and</tspan><tspan x="92" dy="19">why, for every lead.</tspan></text><circle cx="58" cy="526" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="531" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="531" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Claim credits</text><text x="92" y="553" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Flag wrong numbers, wrong ZIPs and</tspan><tspan x="92" dy="19">duplicates while they qualify.</tspan></text><text x="404" y="614" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>