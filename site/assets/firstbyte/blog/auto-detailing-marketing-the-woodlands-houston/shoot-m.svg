<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 665" width="440" height="665" role="img" aria-labelledby="t675155"><title id="t675155">Steps for filming before-and-after detailing video for Instagram and TikTok at a Woodlands auto detailing shop</title><defs><linearGradient id="g675155" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar675155" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="664" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="664" rx="22" fill="url(#g675155)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">How to shoot a</tspan><tspan x="36" dy="30">before-and-after that</tspan><tspan x="36" dy="30">sells</tspan></text><text x="36" y="138" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Same car, same angle, same light</tspan></text><circle cx="58" cy="192" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="197" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="212" y2="250" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="197" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Lock the angle</text><text x="92" y="219" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Mark the tripod spot with tape so</tspan><tspan x="92" dy="19">the before and after match exactly.</tspan></text><circle cx="58" cy="278" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="283" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="298" y2="355" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="283" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Use one light</text><text x="92" y="305" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Shoot both under the same</tspan><tspan x="92" dy="19">swirl-finder or bay light, never one</tspan><tspan x="92" dy="19">outdoors.</tspan></text><circle cx="58" cy="383" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="388" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="403" y2="441" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="388" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Film the 50/50</text><text x="92" y="410" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Tape a line and show half corrected,</tspan><tspan x="92" dy="19">half not, in one frame.</tspan></text><circle cx="58" cy="469" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="474" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="489" y2="527" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="474" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Add one proof shot</text><text x="92" y="496" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Water beading, a paint gauge</tspan><tspan x="92" dy="19">reading, or a clean PPF edge.</tspan></text><circle cx="58" cy="555" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="560" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="560" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Caption the car and town</text><text x="92" y="582" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">“2025 Tahoe, front PPF, Spring TX”</tspan><tspan x="92" dy="19">helps local search and DMs.</tspan></text><text x="404" y="643" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>