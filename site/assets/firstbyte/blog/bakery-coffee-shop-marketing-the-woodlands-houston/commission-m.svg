<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 548" width="440" height="548" role="img" aria-labelledby="t504918"><title id="t504918">Bar chart of DoorDash commission on a $40 bakery order versus direct ordering for coffee shops in The Woodlands and Houston</title><defs><linearGradient id="g504918" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar504918" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="547" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="547" rx="22" fill="url(#g504918)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">What a $40 order costs on</tspan><tspan x="36" dy="30">DoorDash</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Commission only, before payment processing or</tspan><tspan x="36" dy="20">promotions</tspan></text><text x="36" y="184" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Premier delivery (30%)</text><rect x="36" y="192" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="192" width="294.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="208" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$12.00</text><text x="36" y="246" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Plus delivery (25%)</text><rect x="36" y="254" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="254" width="245.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="270" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$10.00</text><text x="36" y="308" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Basic delivery (15%)</text><rect x="36" y="316" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="316" width="147.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="332" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$6.00</text><text x="36" y="370" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Pickup (6%)</text><rect x="36" y="378" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="378" width="58.8" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="394" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$2.40</text><text x="36" y="432" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">Direct order-ahead</text><rect x="36" y="440" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="440" width="8.0" height="22" rx="11" fill="url(#bar504918)"/><text x="344" y="456" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">Processing only</text><text x="36" y="510" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Commission rates from DoorDash’s published</tspan><tspan x="36" dy="16">merchant pricing</tspan></text><text x="404" y="526" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>