<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 597" width="440" height="597" role="img" aria-labelledby="t710731"><title id="t710731">Five steps for a compliant creator seeding program for beverage and supplement brands, from The Woodlands near Houston</title><defs><linearGradient id="g710731" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar710731" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="596" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="596" rx="22" fill="url(#g710731)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A seeding program that</tspan><tspan x="36" dy="30">stays compliant</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">From product box to paid creator ads</tspan></text><circle cx="58" cy="162" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="167" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="182" y2="220" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="167" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Tier creators</text><text x="92" y="189" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Nano, micro and macro, with audience</tspan><tspan x="92" dy="19">age checked.</tspan></text><circle cx="58" cy="248" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="253" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="268" y2="306" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="253" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Brief in the box</text><text x="92" y="275" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Approved claims, do-not-say list,</tspan><tspan x="92" dy="19">disclosure ask.</tspan></text><circle cx="58" cy="334" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="339" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="354" y2="392" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="339" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Rights first</text><text x="92" y="361" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Usage rights in writing before any</tspan><tspan x="92" dy="19">payment.</tspan></text><circle cx="58" cy="420" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="425" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="440" y2="459" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="425" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Monitor</text><text x="92" y="447" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Review every post within 48 hours.</tspan></text><circle cx="58" cy="487" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="492" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="492" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Scale winners</text><text x="92" y="514" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Partnership ads and Spark Ads on</tspan><tspan x="92" dy="19">approved posts.</tspan></text><text x="404" y="575" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>