<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 692" width="440" height="692" role="img" aria-labelledby="t934516"><title id="t934516">Five steps to buy a billboard in Houston, from fixing search to testing digital and tracking results</title><defs><linearGradient id="g934516" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar934516" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="691" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="691" rx="22" fill="url(#g934516)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">How to buy a billboard in</tspan><tspan x="36" dy="30">Houston</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Our order of operations for a first campaign</tspan></text><circle cx="58" cy="162" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="167" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="182" y2="239" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="167" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Fix search first</text><text x="92" y="189" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Make sure Google Ads and your</tspan><tspan x="92" dy="19">Business Profile catch people who</tspan><tspan x="92" dy="19">look you up.</tspan></text><circle cx="58" cy="267" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="272" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="287" y2="344" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="272" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Get three quotes</text><text x="92" y="294" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Ask for face IDs, 4-week</tspan><tspan x="92" dy="19">impressions, data source and a</tspan><tspan x="92" dy="19">driver’s-view photo.</tspan></text><circle cx="58" cy="372" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="377" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="392" y2="449" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="377" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Run the CPM math</text><text x="92" y="399" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Divide price by impressions, then</tspan><tspan x="92" dy="19">adjust for how much traffic fits</tspan><tspan x="92" dy="19">your customer.</tspan></text><circle cx="58" cy="477" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="482" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="497" y2="535" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="482" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Test digital for 4 weeks</text><text x="92" y="504" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Use Blip or a short direct buy</tspan><tspan x="92" dy="19">before any long static contract.</tspan></text><circle cx="58" cy="563" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="568" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="568" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Track and follow up</text><text x="92" y="590" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Vanity URL, tracking number,</tspan><tspan x="92" dy="19">geo-fenced mobile and CTV in the</tspan><tspan x="92" dy="19">same ZIPs.</tspan></text><text x="404" y="670" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>