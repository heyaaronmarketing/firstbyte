<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 471" width="440" height="471" role="img" aria-labelledby="t940601"><title id="t940601">Stat tiles showing billboard attention and phone research rates relevant to billboard advertising in Houston</title><defs><linearGradient id="g940601" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar940601" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="470" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="470" rx="22" fill="url(#g940601)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Do people actually notice</tspan><tspan x="36" dy="30">billboards?</tspan></text><rect x="36" y="120" width="368" height="87" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="176" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">79%</text><text x="186" y="150" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">of consumers notice digital</tspan><tspan x="186" dy="19">billboard ads (Harris Poll</tspan><tspan x="186" dy="19">for OAAA)</tspan></text><rect x="36" y="219" width="368" height="87" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="276" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">35%</text><text x="186" y="248" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">of U.S. adults researched a</tspan><tspan x="186" dy="19">product on their phone</tspan><tspan x="186" dy="19">after an OOH ad (YouGov)</tspan></text><rect x="36" y="318" width="368" height="87" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="374" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">36.3%</text><text x="186" y="348" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">of 2025 U.S. out-of-home</tspan><tspan x="186" dy="19">revenue came from digital</tspan><tspan x="186" dy="19">(OAAA)</tspan></text><text x="36" y="433" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Sources: OAAA/Harris Poll, YouGov, OAAA via</tspan><tspan x="36" dy="16">MediaPost</tspan></text><text x="404" y="449" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>