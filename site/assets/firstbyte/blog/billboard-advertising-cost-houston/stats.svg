adults researched a</tspan><tspan x="304" dy="19">product on their phone after</tspan><tspan x="304" dy="19">an OOH ad (YouGov)</tspan></text><rect x="532" y="90" width="232" height="153" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="552" y="148" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">36.3%</text><text x="552" y="178" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="552" dy="0">of 2025 U.S. out-of-home</tspan><tspan x="552" dy="19">revenue came from digital</tspan><tspan x="552" dy="19">(OAAA)</tspan></text><text x="36" y="271" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Sources: OAAA/Harris Poll, YouGov, OAAA via MediaPost</tspan></text><text x="764" y="271" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>