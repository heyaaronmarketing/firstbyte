<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 486" width="800" height="486" role="img" aria-labelledby="t8437"><title id="t8437">Funnel of the federal trademark process and timeline for a logo designed for a Houston business</title><defs><linearGradient id="g8437" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar8437" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="485" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="485" rx="22" fill="url(#g8437)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">From logo to registered trademark</tspan></text><rect x="36" y="90" width="728" height="64" rx="12" fill="#01f6f2" fill-opacity="0.20" stroke="#01f6f2" stroke-opacity="0.60"/><text x="400" y="116" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="400" dy="0">Clearance search before design is final</tspan></text><text x="400" y="138" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">Week 0</text><rect x="54" y="162" width="692" height="64" rx="12" fill="#01f6f2" fill-opacity="0.18" stroke="#01f6f2" stroke-opacity="0.53"/><text x="400" y="188" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="400" dy="0">File with USPTO, $350 per class</tspan></text><text x="400" y="210" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">Day 1</text><rect x="72" y="234" width="655" height="64" rx="12" fill="#01f6f2" fill-opacity="0.16" stroke="#01f6f2" stroke-opacity="0.46"/><text x="400" y="260" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="400" dy="0">First examination action</tspan></text><text x="400" y="282" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">About 4 months</text><rect x="91" y="306" width="619" height="64" rx="12" fill="#01f6f2" fill-opacity="0.14" stroke="#01f6f2" stroke-opacity="0.38"/><text x="400" y="332" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="400" dy="0">Publication and opposition period</tspan></text><text x="400" y="354" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">Months later</text><rect x="109" y="378" width="582" height="64" rx="12" fill="#01f6f2" fill-opacity="0.12" stroke="#01f6f2" stroke-opacity="0.31"/><text x="400" y="404" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="400" dy="0">Registration (or abandonment)</tspan></text><text x="400" y="426" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">About 10 months average</text><text x="36" y="464" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Average times as of November 5, 2026, per the USPTO. Individual applications vary.</tspan></text><text x="764" y="464" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>