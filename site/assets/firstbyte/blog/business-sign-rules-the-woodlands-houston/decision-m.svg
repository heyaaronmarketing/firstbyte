<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 682" width="440" height="682" role="img" aria-labelledby="t881251"><title id="t881251">Decision steps for whether a business sign is allowed in The Woodlands or Houston, from right-of-way to permits</title><defs><linearGradient id="g881251" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar881251" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="681" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="681" rx="22" fill="url(#g881251)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Can I put this sign here?</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Run every sign through these questions before</tspan><tspan x="36" dy="20">you order it</tspan></text><circle cx="58" cy="152" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="157" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="172" y2="229" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="157" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Is it in the road right-of-way?</text><text x="92" y="179" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Median, curb strip, utility pole or</tspan><tspan x="92" dy="19">highway frontage: stop. State law</tspan><tspan x="92" dy="19">says no.</tspan></text><circle cx="58" cy="257" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="262" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="277" y2="315" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="262" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Whose rules cover the lot?</text><text x="92" y="284" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Township covenants, a city, Harris</tspan><tspan x="92" dy="19">County or the City of Houston.</tspan></text><circle cx="58" cy="343" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="348" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="363" y2="420" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="348" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Is it pre-approved?</text><text x="92" y="370" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">In The Woodlands, a compliant</tspan><tspan x="92" dy="19">A-frame or menu board is. Most other</tspan><tspan x="92" dy="19">signs aren’t.</tspan></text><circle cx="58" cy="448" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="453" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="468" y2="525" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="453" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Does it need approval or a permit?</text><text x="92" y="475" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Submit before you fabricate. Houston</tspan><tspan x="92" dy="19">permits go through licensed</tspan><tspan x="92" dy="19">contractors.</tspan></text><circle cx="58" cy="553" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="558" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="558" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Does it expire?</text><text x="92" y="580" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Opening banners, leasing signs and</tspan><tspan x="92" dy="19">Houston banners all have clocks.</tspan><tspan x="92" dy="19">Calendar the removal date.</tspan></text><text x="404" y="660" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>