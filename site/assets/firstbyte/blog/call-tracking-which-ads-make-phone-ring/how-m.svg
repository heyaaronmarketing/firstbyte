<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 674" width="440" height="674" role="img" aria-labelledby="t441393"><title id="t441393">Five steps showing how call tracking with dynamic number insertion works for a Houston or The Woodlands business website</title><defs><linearGradient id="g441393" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar441393" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="673" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="673" rx="22" fill="url(#g441393)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">How dynamic number</tspan><tspan x="36" dy="30">insertion credits a call</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">What happens between a Google search and a</tspan><tspan x="36" dy="20">ringing phone</tspan></text><circle cx="58" cy="182" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="187" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="202" y2="259" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="187" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Visitor arrives</text><text x="92" y="209" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">From an ad, the map pack, Facebook</tspan><tspan x="92" dy="19">or an email, carrying a click ID or</tspan><tspan x="92" dy="19">UTM tags.</tspan></text><circle cx="58" cy="287" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="292" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="307" y2="345" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="292" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Script swaps the number</text><text x="92" y="314" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Your site shows a number from the</tspan><tspan x="92" dy="19">pool assigned to that source.</tspan></text><circle cx="58" cy="373" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="378" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="393" y2="450" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="378" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Customer calls</text><text x="92" y="400" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">The call forwards to your normal</tspan><tspan x="92" dy="19">line, with an optional whisper to</tspan><tspan x="92" dy="19">staff.</tspan></text><circle cx="58" cy="478" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="483" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="498" y2="536" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="483" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Provider logs it</text><text x="92" y="505" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Source, landing page, keyword,</tspan><tspan x="92" dy="19">duration and recording are saved.</tspan></text><circle cx="58" cy="564" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="569" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="569" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Results flow back</text><text x="92" y="591" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Qualified calls go to Google Ads and</tspan><tspan x="92" dy="19">GA4 as conversions.</tspan></text><text x="404" y="652" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>