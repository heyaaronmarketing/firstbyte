<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 590" width="440" height="590" role="img" aria-labelledby="t537366"><title id="t537366">Steps for a catering company to get on venue preferred vendor lists in Houston and Montgomery County</title><defs><linearGradient id="g537366" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar537366" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="589" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="589" rx="22" fill="url(#g537366)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Getting on a venue’s</tspan><tspan x="36" dy="30">preferred list</tspan></text><circle cx="58" cy="136" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="141" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="156" y2="194" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="141" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Work the room well</text><text x="92" y="163" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">On time, follow load-in rules, clean</tspan><tspan x="92" dy="19">up completely.</tspan></text><circle cx="58" cy="222" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="227" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="242" y2="280" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="227" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Send photos within a week</text><text x="92" y="249" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Coordinators need content, and they</tspan><tspan x="92" dy="19">remember who sends it.</tspan></text><circle cx="58" cy="308" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="313" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="328" y2="366" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="313" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Ask after event two or three</text><text x="92" y="335" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Does the venue keep a list, and what</tspan><tspan x="92" dy="19">does it take?</tspan></text><circle cx="58" cy="394" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="399" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="414" y2="452" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="399" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Build a venue page</text><text x="92" y="421" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">“Catering at [venue]” with photos</tspan><tspan x="92" dy="19">and a fitting sample menu.</tspan></text><circle cx="58" cy="480" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="485" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="485" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Stay in touch</text><text x="92" y="507" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">A quarterly check-in and a holiday</tspan><tspan x="92" dy="19">thank-you.</tspan></text><text x="404" y="568" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>