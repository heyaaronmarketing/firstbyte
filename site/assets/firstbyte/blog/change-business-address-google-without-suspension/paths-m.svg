<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 594" width="440" height="594" role="img" aria-labelledby="t443379"><title id="t443379">Comparison of creating a new Google Business Profile versus editing the address when a Houston business moves</title><defs><linearGradient id="g443379" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar443379" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="593" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="593" rx="22" fill="url(#g443379)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Moving with a new profile</tspan><tspan x="36" dy="30">vs. editing yours</tspan></text><rect x="36" y="120" width="368" height="206" rx="16" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.09)"/><rect x="36" y="342" width="368" height="206" rx="16" fill="rgba(1,246,242,.05)" stroke="rgba(1,246,242,.45)"/><text x="58" y="158" fill="#cfcad2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600">Create a new profile</text><path d="M59 175 l8 8 M67 175 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="184" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Reviews stay on the old listing</tspan></text><path d="M59 209 l8 8 M67 209 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="218" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Two listings for one business</tspan></text><path d="M59 243 l8 8 M67 243 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="252" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Support tickets to move reviews</tspan></text><path d="M59 277 l8 8 M67 277 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="286" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Listing age and history reset</tspan></text><text x="58" y="380" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600">Edit the existing profile</text><path d="M58 402 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="80" y="406" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Reviews transfer with the same name</tspan></text><path d="M58 436 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="80" y="440" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">One listing, no duplicate</tspan></text><path d="M58 470 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="80" y="474" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">One re-verification to pass</tspan></text><path d="M58 504 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="80" y="508" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Photos and history stay put</tspan></text><text x="404" y="572" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>