<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 731" width="440" height="731" role="img" aria-labelledby="t545780"><title id="t545780">Step diagram of a past-patient reactivation sequence for a chiropractic clinic in The Woodlands using email and text</title><defs><linearGradient id="g545780" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar545780" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="730" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="730" rx="22" fill="url(#g545780)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A simple past-patient</tspan><tspan x="36" dy="30">reactivation sequence</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">For patients who haven&#x27;t visited in 6 to 18</tspan><tspan x="36" dy="20">months</tspan></text><circle cx="58" cy="182" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="187" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="202" y2="259" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="187" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Pull the list</text><text x="92" y="209" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Export patients with no visit in</tspan><tspan x="92" dy="19">6-18 months who agreed to email or</tspan><tspan x="92" dy="19">text.</tspan></text><circle cx="58" cy="287" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="292" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="307" y2="364" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="292" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Send a check-in email</text><text x="92" y="314" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">A short note from the doctor asking</tspan><tspan x="92" dy="19">how they&#x27;re feeling, with a booking</tspan><tspan x="92" dy="19">link.</tspan></text><circle cx="58" cy="392" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="397" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="412" y2="469" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="397" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Follow with one text</text><text x="92" y="419" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Three days later, a one-line text</tspan><tspan x="92" dy="19">with the link and a reply-to-book</tspan><tspan x="92" dy="19">option.</tspan></text><circle cx="58" cy="497" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="502" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="517" y2="574" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="502" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Offer a check-up slot</text><text x="92" y="524" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Hold a few times each week for</tspan><tspan x="92" dy="19">returning patients so booking is</tspan><tspan x="92" dy="19">easy.</tspan></text><circle cx="58" cy="602" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="607" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="607" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Stop and log</text><text x="92" y="629" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Two touches, then stop. Mark who</tspan><tspan x="92" dy="19">booked so you can measure the</tspan><tspan x="92" dy="19">return.</tspan></text><text x="404" y="709" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>