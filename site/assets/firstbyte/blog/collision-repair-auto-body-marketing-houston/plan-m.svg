<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 519" width="440" height="519" role="img" aria-labelledby="t361228"><title id="t361228">Ninety-day collision repair marketing plan for a body shop in Houston and The Woodlands</title><defs><linearGradient id="g361228" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar361228" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="518" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="518" rx="22" fill="url(#g361228)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">The first 90 days</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Order of work for a single-location body shop</tspan></text><circle cx="58" cy="132" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="137" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="152" y2="209" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="137" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 1-30</text><text x="92" y="159" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Fix the Google profile, start review</tspan><tspan x="92" dy="19">texts, build the right-to-choose</tspan><tspan x="92" dy="19">page.</tspan></text><circle cx="58" cy="237" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="242" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="257" y2="295" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="242" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 31-60</text><text x="92" y="264" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Launch the photo estimate form and</tspan><tspan x="92" dy="19">core collision search ads.</tspan></text><circle cx="58" cy="323" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="328" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="343" y2="381" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="328" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 61-90</text><text x="92" y="350" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Add hail and OEM ad groups, a</tspan><tspan x="92" dy="19">Spanish page, partner visits.</tspan></text><circle cx="58" cy="409" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="414" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><text x="92" y="414" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Ongoing</text><text x="92" y="436" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Source every repair order, review</tspan><tspan x="92" dy="19">weekly, adjust to capacity.</tspan></text><text x="404" y="497" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>