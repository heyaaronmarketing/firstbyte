<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 651" width="440" height="651" role="img" aria-labelledby="t758431"><title id="t758431">Google Ads benchmark CPC and cost per lead for commercial cleaning and janitorial companies advertising in Houston</title><defs><linearGradient id="g758431" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar758431" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="650" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="650" rx="22" fill="url(#g758431)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Google Ads benchmarks</tspan><tspan x="36" dy="30">closest to commercial</tspan><tspan x="36" dy="30">cleaning</tspan></text><rect x="36" y="150" width="368" height="91" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="196" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">$5.87</text><text x="56" y="222" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="56" dy="0">Median CPC, Business Services</tspan></text><rect x="36" y="253" width="368" height="91" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="299" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">$93.69</text><text x="56" y="325" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="56" dy="0">Median cost per lead, Business Services</tspan></text><rect x="36" y="356" width="368" height="91" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="402" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">4.85%</text><text x="56" y="428" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="56" dy="0">Median conversion rate, Business Services</tspan></text><rect x="36" y="459" width="368" height="110" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="505" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">$75.19</text><text x="56" y="531" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="56" dy="0">Median cost per lead, Industrial &amp;</tspan><tspan x="56" dy="19">Commercial</tspan></text><text x="36" y="597" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">WordStream/LocaliQ 2026 benchmarks, April 2025</tspan><tspan x="36" dy="16">to March 2026. No cleaning-specific category</tspan><tspan x="36" dy="16">exists.</tspan></text><text x="404" y="629" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>