<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" width="440" height="470" role="img" aria-labelledby="t809436"><title id="t809436">Illustrative lifetime value of a commercial cleaning contract for a janitorial company in Houston</title><defs><linearGradient id="g809436" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar809436" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="469" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="469" rx="22" fill="url(#g809436)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">What one office contract</tspan><tspan x="36" dy="30">is worth</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">20,000 sq ft office, five nights a week,</tspan><tspan x="36" dy="20">$3,500 a month</tspan></text><text x="36" y="184" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Monthly invoice</text><rect x="36" y="192" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="192" width="8.2" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="208" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$3,500</text><text x="36" y="246" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">First-year revenue</text><rect x="36" y="254" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="254" width="98.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="270" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$42,000</text><text x="36" y="308" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">Three-year revenue</text><rect x="36" y="316" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="316" width="294.0" height="22" rx="11" fill="url(#bar809436)"/><text x="344" y="332" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$126,000</text><text x="36" y="370" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Three-year profit at 15-20%</text><rect x="36" y="378" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="378" width="58.8" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="394" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$18.9K-$25.2K</text><text x="36" y="448" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example</tspan></text><text x="404" y="448" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>