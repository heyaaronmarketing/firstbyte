<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 627" width="440" height="627" role="img" aria-labelledby="t885459"><title id="t885459">Steps from slab selection to countertop installation for countertop fabricator marketing in Houston and The Woodlands</title><defs><linearGradient id="g885459" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar885459" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="626" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="626" rx="22" fill="url(#g885459)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Template to install, the</tspan><tspan x="36" dy="30">way homeowners should see</tspan><tspan x="36" dy="30">it</tspan></text><text x="36" y="138" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Publish your real days between steps</tspan></text><circle cx="58" cy="192" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="197" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="212" y2="250" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="197" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Select and deposit</text><text x="92" y="219" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Pick the slab at the yard; tag it</tspan><tspan x="92" dy="19">with a hold.</tspan></text><circ