<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 521" width="800" height="521" role="img" aria-labelledby="t885459"><title id="t885459">Steps from slab selection to countertop installation for countertop fabricator marketing in Houston and The Woodlands</title><defs><linearGradient id="g885459" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar885459" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="520" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="520" rx="22" fill="url(#g885459)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Template to install, the way homeowners should see</tspan><tspan x="36" dy="30">it</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Publish your real days between steps</tspan></text><circle cx="58" cy="162" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="167" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="182" y2="201" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="167" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Select and deposit</text><text x="92" y="189" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Pick the slab at the yard; tag it with a hold.</tspan></text><circle cx="58" cy="229" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="234" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="249" y2="268" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="234" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Template</text><text x="92" y="256" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Cabinets set and level, sink on site.</tspan></text><circle cx="58" cy="296" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="301" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="316" y2="335" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="301" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Layout approval</text><text x="92" y="323" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Seams and veining approved before cutting.</tspan></text><circle cx="58" cy="363" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="368" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="383" y2="402" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="368" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Fabrication</text><text x="92" y="390" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">A photo of their slab on the saw.</tspan></text><circle cx="58" cy="430" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="435" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="435" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Install</text><text x="92" y="457" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Tops set, cutouts finished, final wipe.</tspan></text><text x="764" y="499" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>