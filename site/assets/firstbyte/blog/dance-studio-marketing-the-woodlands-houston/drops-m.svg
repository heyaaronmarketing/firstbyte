<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 450" width="440" height="450" role="img" aria-labelledby="t150772"><title id="t150772">Bar chart of when families leave a dance studio in The Woodlands or Houston during the season</title><defs><linearGradient id="g150772" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar150772" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="449" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="449" rx="22" fill="url(#g150772)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">When families tend to</tspan><tspan x="36" dy="30">leave</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Share of a season’s dropouts by period</tspan></text><text x="36" y="164" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">September: never settled in</text><rect x="36" y="172" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="172" width="139.3" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="188" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">18%</text><text x="36" y="226" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">January: after winter break</text><rect x="36" y="234" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="234" width="232.1" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="250" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">30%</text><text x="36" y="288" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Costume deposit and spring break</text><rect x="36" y="296" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="296" width="108.3" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="312" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">14%</text><text x="36" y="350" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">June: after the recital</text><rect x="36" y="358" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="358" width="294.0" height="22" rx="11" fill="url(#bar150772)"/><text x="344" y="374" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">38%</text><text x="36" y="428" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example</tspan></text><text x="404" y="428" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>