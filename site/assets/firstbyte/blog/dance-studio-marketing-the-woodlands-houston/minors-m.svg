<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 573" width="440" height="573" role="img" aria-labelledby="t881622"><title id="t881622">Checklist for using photos of child dancers in Meta ads for a dance studio in The Woodlands and Houston</title><defs><linearGradient id="g881622" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar881622" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="572" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="572" rx="22" fill="url(#g881622)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Before a student appears</tspan><tspan x="36" dy="30">in an ad</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Consent and care for photos of minors</tspan></text><rect x="36.0" y="146" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 157.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="162" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Photo and video release in the</tspan><tspan x="70.0" dy="19">registration form, with an opt-out</tspan></text><rect x="36.0" y="204" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 215.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="220" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Separate yes for paid ads, not just</tspan><tspan x="70.0" dy="19">social posts</tspan></text><rect x="36.0" y="262" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 273.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="278" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">No last names, schools or class times</tspan><tspan x="70.0" dy="19">beside a child’s face</tspan></text><rect x="36.0" y="320" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 331.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="336" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Group and stage shots over costume</tspan><tspan x="70.0" dy="19">close-ups</tspan></text><rect x="36.0" y="378" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 389.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="394" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Comments watched and filtered on posts</tspan><tspan x="70.0" dy="19">with kids</tspan></text><rect x="36.0" y="436" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 447.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="452" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Teachers and adult dancers in most paid</tspan><tspan x="70.0" dy="19">creative</tspan></text><rect x="36.0" y="494" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 505.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="510" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Remove any image the day a parent asks</tspan></text><text x="404" y="551" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>