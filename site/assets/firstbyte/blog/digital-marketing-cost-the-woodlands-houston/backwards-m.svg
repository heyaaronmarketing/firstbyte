<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" width="440" height="560" role="img" aria-labelledby="t840231"><title id="t840231">Steps to build a small business marketing budget backwards from customer value for Houston and The Woodlands</title><defs><linearGradient id="g840231" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar840231" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="559" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="559" rx="22" fill="url(#g840231)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Build the budget backwards</tspan></text><circle cx="58" cy="106" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="111" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="126" y2="164" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="111" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Customer value</text><text x="92" y="133" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Gross profit from an average new</tspan><tspan x="92" dy="19">customer over a year or two.</tspan></text><circle cx="58" cy="192" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="197" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="212" y2="250" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="197" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Affordable cost</text><text x="92" y="219" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">What you’ll pay to win one, often</tspan><tspan x="92" dy="19">15% to 30% of that value.</tspan></text><circle cx="58" cy="278" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="283" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="298" y2="336" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="283" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Monthly goal</text><text x="92" y="305" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">How many new customers you need each</tspan><tspan x="92" dy="19">month.</tspan></text><circle cx="58" cy="364" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="369" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="384" y2="422" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="369" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Acquisition budget</text><text x="92" y="391" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Affordable cost times customers</tspan><tspan x="92" dy="19">needed.</tspan></text><circle cx="58" cy="450" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="455" text-anchor="mi