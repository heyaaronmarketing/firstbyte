<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 394" width="800" height="394" role="img" aria-labelledby="t309738"><title id="t309738">Comparison of EDDM Retail and EDDM BMEU options for direct mail campaigns in The Woodlands and Houston</title><defs><linearGradient id="g309738" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar309738" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="393" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="393" rx="22" fill="url(#g309738)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">EDDM Retail vs. EDDM BMEU</tspan></text><rect x="36" y="90" width="354" height="258" rx="16" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.09)"/><rect x="410" y="90" width="354" height="258" rx="16" fill="rgba(1,246,242,.05)" stroke="rgba(1,246,242,.45)"/><text x="58" y="128" fill="#cfcad2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600">EDDM Retail</text><path d="M59 145 l8 8 M67 145 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="154" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">$0.260 per piece, no permit</tspan></text><path d="M59 179 l8 8 M67 179 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="188" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">5,000 pieces per day per ZIP</tspan></text><path d="M59 213 l8 8 M67 213 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="222" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">You bundle, label and drop off</tspan></text><path d="M59 247 l8 8 M67 247 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="256" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Pieces up to 3.3 oz</tspan></text><path d="M59 281 l8 8 M67 281 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="290" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Best under about 10,000 pieces</tspan></text><text x="432.0" y="128" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600">EDDM BMEU</text><path d="M432.0 150 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="454.0" y="154" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="454.0" dy="0">Lower postage, priced by entry point</tspan></text><path d="M432.0 184 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="454.0" y="188" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="454.0" dy="0">No daily cap</tspan></text><path d="M432.0 218 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="454.0" y="222" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="454.0" dy="0">Mail house usually preps and enters</tspan><tspan x="454.0" dy="18">it</tspan></text><path d="M432.0 270 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="454.0" y="274" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="454.0" dy="0">Heavier pieces at a per-pound price</tspan></text><path d="M432.0 304 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="454.0" y="308" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="454.0" dy="0">Best for big or monthly drops</tspan></text><text x="764" y="372" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>