<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 635" width="440" height="635" role="img" aria-labelledby="t899743"><title id="t899743">Five steps to plan an EDDM carrier route mailing in The Woodlands and Houston using the USPS mapping tool</title><defs><linearGradient id="g899743" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar899743" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="634" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="634" rx="22" fill="url(#g899743)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Planning a drop in the</tspan><tspan x="36" dy="30">EDDM mapping tool</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">How we pick about 5,000 homes in The Woodlands</tspan></text><circle cx="58" cy="162" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="167" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="182" y2="220" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="167" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Start from your shop or service area</text><text x="92" y="189" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Enter an address or ZIP Code, then</tspan><tspan x="92" dy="19">zoom to street level.</tspan></text><circle cx="58" cy="248" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="253" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="268" y2="306" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="253" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Turn off business addresses</text><text x="92" y="275" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Keep residential only unless you</tspan><tspan x="92" dy="19">sell to businesses.</tspan></text><circle cx="58" cy="334" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="339" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="354" y2="392" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="339" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Filter by the Census data</text><text x="92" y="361" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Use age, income and household size</tspan><tspan x="92" dy="19">to drop poor-fit routes.</tspan></text><circle cx="58" cy="420" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="425" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="440" y2="497" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="425" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Add routes until you hit the count</text><text x="92" y="447" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Watch the running total. Stop near</tspan><tspan x="92" dy="19">5,000 if dropping in one day per</tspan><tspan x="92" dy="19">ZIP.</tspan></text><circle cx="58" cy="525" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="530" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="530" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Export the route list</text><text x="92" y="552" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Save it for bundling, for matchback,</tspan><tspan x="92" dy="19">and for matching ad geo-targets.</tspan></text><text x="404" y="613" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>