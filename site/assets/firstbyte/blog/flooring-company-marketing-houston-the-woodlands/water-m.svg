<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 586" width="440" height="586" role="img" aria-labelledby="t595431"><title id="t595431">Stats on Harvey flooding, Beryl outages and flood insurance that drive flooring replacement demand in Houston</title><defs><linearGradient id="g595431" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar595431" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="585" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="585" rx="22" fill="url(#g595431)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Why Houston keeps</tspan><tspan x="36" dy="30">replacing floors</tspan></text><rect x="36" y="120" width="368" height="91" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="166" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">154K</text><text x="56" y="192" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="56" dy="0">Harris County homes flooded in Harvey</tspan></text><rect x="36" y="223" width="368" height="91" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="269" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">36%</text><text x="56" y="295" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="56" dy="0">of those homes had flood insurance</tspan></text><rect x="36" y="326" width="368" height="91" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="372" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">2.26M</text><text x="56" y="398" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="56" dy="0">CenterPoint outages after Beryl</tspan></text><rect x="36" y="429" width="368" height="91" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="475" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">30 days</text><text x="56" y="501" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="56" dy="0">typical flood policy waiting period</tspan></text><text x="36" y="548" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Sources: HCFCD via Community Impact, Texas</tspan><tspan x="36" dy="16">Tribune, TDI</tspan></text><text x="404" y="564" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>