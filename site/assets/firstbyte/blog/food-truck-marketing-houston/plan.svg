<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 465" width="800" height="465" role="img" aria-labelledby="t971555"><title id="t971555">Thirty-day food truck marketing plan for Houston, The Woodlands and Spring</title><defs><linearGradient id="g971555" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar971555" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="464" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="464" rx="22" fill="url(#g971555)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">First 30 days for a Houston food truck</tspan></text><circle cx="58" cy="106" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="111" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="126" y2="145" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="111" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Week 1: clean up Google</text><text x="92" y="133" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Fix category, hours, service areas, photos and the booking link.</tspan></text><circle cx="58" cy="173" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="178" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="193" y2="212" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="178" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Week 1: one posting template</text><text x="92" y="200" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Same graphic and order for daily location posts.</tspan></text><circle cx="58" cy="240" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="245" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="260" y2="279" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="245" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Week 2: events page</text><text x="92" y="267" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Packages, minimums, license, insurance, weather policy, quote form.</tspan></text><circle cx="58" cy="307" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="312" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="327" y2="346" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="312" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Week 3: outreach</text><text x="92" y="334" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Email 20 office and apartment contacts and two breweries.</tspan></text><circle cx="58" cy="374" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="379" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="379" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Week 4: reviews and texts</text><text x="92" y="401" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Window QR code for reviews and a text list sign-up.</tspan></text><text x="764" y="443" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>