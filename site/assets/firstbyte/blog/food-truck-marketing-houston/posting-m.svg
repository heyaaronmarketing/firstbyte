<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 673" width="440" height="673" role="img" aria-labelledby="t495725"><title id="t495725">Steps for a daily food truck location posting routine on Instagram and Facebook in Houston and The Woodlands</title><defs><linearGradient id="g495725" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar495725" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="672" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="672" rx="22" fill="url(#g495725)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A daily location-posting</tspan><tspan x="36" dy="30">routine</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Ten minutes a day, same order every time</tspan></text><circle cx="58" cy="162" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="167" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="182" y2="239" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="167" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Monday: weekly schedule</text><text x="92" y="189" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Pin one post with every spot and</tspan><tspan x="92" dy="19">time for the week on Instagram and</tspan><tspan x="92" dy="19">Facebook.</tspan></text><circle cx="58" cy="267" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="272" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="287" y2="344" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="272" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Morning: today’s spot</text><text x="92" y="294" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Story with the location sticker,</tspan><tspan x="92" dy="19">cross streets, hours and one menu</tspan><tspan x="92" dy="19">item.</tspan></text><circle cx="58" cy="372" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="377" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="392" y2="430" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="377" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">One hour before open</text><text x="92" y="399" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">A short video of prep or the first</tspan><tspan x="92" dy="19">order, tagged to the host.</tspan></text><circle cx="58" cy="458" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="463" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="478" y2="535" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="463" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">During service</text><text x="92" y="485" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Repost tagged customer stories;</tspan><tspan x="92" dy="19">reply to messages asking where you</tspan><tspan x="92" dy="19">are.</tspan></text><circle cx="58" cy="563" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="568" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="568" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Changes: post first</text><text x="92" y="590" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Rain, sellout or cancellation goes</tspan><tspan x="92" dy="19">up before anything else.</tspan></text><text x="404" y="651" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>