<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 528" width="440" height="528" role="img" aria-labelledby="t681767"><title id="t681767">Bar chart comparing the annual cost of a fractional CMO, an agency and an in-house marketing hire for a Houston business</title><defs><linearGradient id="g681767" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar681767" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="527" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="527" rx="22" fill="url(#g681767)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Rough annual cost of each</tspan><tspan x="36" dy="30">option</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Thousands of dollars per year, before ad spend</tspan></text><text x="36" y="164" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Marketing manager</text><rect x="36" y="172" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="172" width="294.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="188" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">~$178K</text><text x="36" y="226" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">Fractional CMO, avg</text><rect x="36" y="234" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="234" width="237.8" height="22" rx="11" fill="url(#bar681767)"/><text x="344" y="250" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">~$144K</text><text x="36" y="288" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Marketing specialist</text><rect x="36" y="296" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="296" width="133.8" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="312" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">~$81K</text><text x="36" y="350" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Fractional advisor</text><rect x="36" y="358" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="358" width="89.2" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="374" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$36K-$72K</text><text x="36" y="412" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Agency, 1-2 channels</text><rect x="36" y="420" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="420" width="69.4" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="436" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$24K-$60K</text><text x="36" y="490" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative ranges; salaries from BLS plus</tspan><tspan x="36" dy="16">30% benefits</tspan></text><text x="404" y="506" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-s