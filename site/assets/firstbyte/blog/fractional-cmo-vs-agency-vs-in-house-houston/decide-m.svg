<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 635" width="440" height="635" role="img" aria-labelledby="t869729"><title id="t869729">Five-step decision guide for choosing a fractional CMO, an agency or an in-house marketing hire in The Woodlands</title><defs><linearGradient id="g869729" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar869729" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="634" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="634" rx="22" fill="url(#g869729)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Pick your marketing setup</tspan><tspan x="36" dy="30">in 5 questions</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Answer in order and stop at the first yes</tspan></text><circle cx="58" cy="162" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="167" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="182" y2="239" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="167" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Is media spend under $2K a month?</text><text x="92" y="189" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Fix tracking and your Business</tspan><tspan x="92" dy="19">Profile yourself, or hire one</tspan><tspan x="92" dy="19">specialist for one channel.</tspan></text><circle cx="58" cy="267" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="272" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="287" y2="325" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="272" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Do you lack hands more than ideas?</text><text x="92" y="294" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Start with an agency for the channel</tspan><tspan x="92" dy="19">that drives most leads.</tspan></text><circle cx="58" cy="353" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="358" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="373" y2="411" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="358" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Are 3+ vendors or channels unmanaged?</text><text x="92" y="380" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Add a fractional CMO at 10 to 20</tspan><tspan x="92" dy="19">hours a week to steer them.</tspan></text><circle cx="58" cy="439" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="444" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="459" y2="497" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="444" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Is local content constantly late?</text><text x="92" y="466" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Hire a coordinator to work alongside</tspan><tspan x="92" dy="19">the agency.</tspan></text><circle cx="58" cy="525" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="530" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="530" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Revenue over $20M with a team to lead?</text><text x="92" y="552" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Hire a full-time marketing leader</tspan><tspan x="92" dy="19">and keep specialist agencies.</tspan></text><text x="404" y="613" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>