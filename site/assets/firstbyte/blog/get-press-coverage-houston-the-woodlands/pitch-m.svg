<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 578" width="440" height="578" role="img" aria-labelledby="t384004"><title id="t384004">Five steps of an email pitch for local press coverage in Houston and The Woodlands</title><defs><linearGradient id="g384004" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar384004" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="577" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="577" rx="22" fill="url(#g384004)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Anatomy of a pitch that</tspan><tspan x="36" dy="30">gets read</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">About 100 words, no attachments</tspan></text><circle cx="58" cy="162" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="167" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="182" y2="201" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="167" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Subject line</text><text x="92" y="189" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">The news itself: what, where, when.</tspan></text><circle cx="58" cy="229" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="234" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="249" y2="287" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="234" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">First sentence</text><text x="92" y="256" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">The fact a reader would repeat to a</tspan><tspan x="92" dy="19">neighbor.</tspan></text><circle cx="58" cy="315" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="320" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="335" y2="373" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="320" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Why it matters here</text><text x="92" y="342" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">One line on what changes for that</tspan><tspan x="92" dy="19">area.</tspan></text><circle cx="58" cy="401" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="406" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="421" y2="440" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="406" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Quick facts</text><text x="92" y="428" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Address, date, hours, jobs, website.</tspan></text><circle cx="58" cy="468" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="473" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="473" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">The offer</text><text x="92" y="495" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Who can talk today, and photos ready</tspan><tspan x="92" dy="19">to use.</tspan></text><text x="404" y="556" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>