<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 635" width="440" height="635" role="img" aria-labelledby="t896400"><title id="t896400">Steps to look up who controls a business domain with ICANN Lookup before getting it back from a web designer in Houston</title><defs><linearGradient id="g896400" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar896400" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="634" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="634" rx="22" fill="url(#g896400)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Find out who controls your</tspan><tspan x="36" dy="30">domain</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Ten minutes with ICANN Lookup</tspan></text><circle cx="58" cy="162" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="167" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="182" y2="239" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="167" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Search lookup.icann.org</text><text x="92" y="189" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Enter your domain. RDAP data</tspan><tspan x="92" dy="19">replaced WHOIS for .com and similar</tspan><tspan x="92" dy="19">in 2025.</tspan></text><circle cx="58" cy="267" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="272" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="287" y2="325" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="272" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Note the registrar</text><text x="92" y="294" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">That company holds the registration</tspan><tspan x="92" dy="19">and handles transfers.</tspan></text><circle cx="58" cy="353" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="358" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="373" y2="411" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="358" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Check the dates</text><text x="92" y="380" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">An expiration date next month is</tspan><tspan x="92" dy="19">your deadline.</tspan></text><circle cx="58" cy="439" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="444" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="459" y2="497" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="444" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Read the status codes</text><text x="92" y="466" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Transfer lock is normal. Redemption</tspan><tspan x="92" dy="19">or pending delete is an emergency.</tspan></text><circle cx="58" cy="525" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="530" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="530" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Check the nameservers</text><text x="92" y="552" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">They show who controls DNS, and so</tspan><tspan x="92" dy="19">your website and email.</tspan></text><text x="404" y="613" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>