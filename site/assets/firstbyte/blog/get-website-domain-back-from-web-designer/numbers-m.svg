<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 518" width="440" height="518" role="img" aria-labelledby="t942106"><title id="t942106">Key deadlines for getting a domain and Google Business Profile back from a web designer in Houston and Texas</title><defs><linearGradient id="g942106" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar942106" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="517" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="517" rx="22" fill="url(#g942106)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Deadlines worth knowing</tspan></text><rect x="36" y="90" width="368" height="76" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="141" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">5 days</text><text x="186" y="124" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">for a registrar to provide</tspan><tspan x="186" dy="19">your auth code</tspan></text><rect x="36" y="178" width="368" height="87" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="234" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">60 days</text><text x="186" y="208" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">transfer lock after</tspan><tspan x="186" dy="19">registration, transfer or</tspan><tspan x="186" dy="19">registrant change</tspan></text><rect x="36" y="277" width="368" height="87" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="334" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">3 days</text><text x="186" y="306" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">for a Business Profile</tspan><tspan x="186" dy="19">owner to answer your</tspan><tspan x="186" dy="19">request</tspan></text><rect x="36" y="376" width="368" height="76" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="427" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">$20,000</text><text x="186" y="410" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">Texas justice court small</tspan><tspan x="186" dy="19">claims limit</tspan></text><text x="36" y="480" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Sources: ICANN, Google Business Profile Help,</tspan><tspan x="36" dy="16">Texas State Law Library</tspan></text><text x="404" y="496" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>