<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 536" width="440" height="536" role="img" aria-labelledby="t618348"><title id="t618348">Checklist of Google Ad Grants website requirements for Houston and The Woodlands nonprofit websites</title><defs><linearGradient id="g618348" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar618348" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="535" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="535" rx="22" fill="url(#g618348)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Website checks before you</tspan><tspan x="36" dy="30">apply</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Based on Google’s Ad Grants website policy</tspan></text><rect x="36.0" y="146" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 157.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="162" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">You own the domain the ads point to</tspan></text><rect x="36.0" y="185" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 196.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="201" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Every page loads over HTTPS</tspan></text><rect x="36.0" y="224" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 235.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="240" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Real, original content on each program</tspan></text><rect x="36.0" y="263" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 274.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="279" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">No AdSense or excess third-party ads</tspan></text><rect x="36.0" y="302" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 313.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="318" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Donate button goes to a secure donation</tspan><tspan x="70.0" dy="19">page</tspan></text><rect x="36.0" y="360" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 371.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="376" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">No broken links or 404s</tspan></text><rect x="36.0" y="399" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 410.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="415" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Pages load fast on a phone</tspan></text><rect x="36.0" y="438" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 449.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="454" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Clear menu: programs, volunteer, give,</tspan><tspan x="70.0" dy="19">about</tspan></text><text x="404" y="514" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>