<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="t618348"><title id="t618348">Checklist of Google Ad Grants website requirements for Houston and The Woodlands nonprofit websites</title><defs><linearGradient id="g618348" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar618348" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="349" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="349" rx="22" fill="url(#g618348)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Website checks before you apply</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Based on Google’s Ad Grants website policy</tspan></text><rect x="36.0" y="116" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 127.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="132" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">You own the domain the ads point to</tspan></text><rect x="36.0" y="155" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 166.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="171" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Every page loads over HTTPS</tspan></text><rect x="36.0" y="194" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 205.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="210" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Real, original content on each program</tspan></text><rect x="36.0" y="233" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 244.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="249" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">No AdSense or excess third-party ads</tspan></text><rect x="400.0" y="116" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M406.0 127.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="434.0" y="132" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="434.0" dy="0">Donate button goes to a secure donation</tspan><tspan x="434.0" dy="19">page</tspan></text><rect x="400.0" y="174" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M406.0 185.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="434.0" y="190" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="434.0" dy="0">No broken links or 404s</tspan></text><rect x="400.0" y="213" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M406.0 224.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="434.0" y="229" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="434.0" dy="0">Pages load fast on a phone</tspan></text><rect x="400.0" y="252" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M406.0 263.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="434.0" y="268" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="434.0" dy="0">Clear menu: programs, volunteer, give,</tspan><tspan x="434.0" dy="19">about</tspan></text><text x="764" y="328" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>