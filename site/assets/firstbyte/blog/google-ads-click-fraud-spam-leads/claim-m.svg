<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 571" width="440" height="571" role="img" aria-labelledby="t141847"><title id="t141847">Steps for a Houston business to request a Google Ads invalid click investigation and credit</title><defs><linearGradient id="g141847" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar141847" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="570" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="570" rx="22" fill="url(#g141847)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Filing an invalid activity</tspan><tspan x="36" dy="30">claim</tspan></text><circle cx="58" cy="136" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="141" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="156" y2="175" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="141" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Check the window</text><text x="92" y="163" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Only the last 60 days are covered.</tspan></text><circle cx="58" cy="203" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="208" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="223" y2="261" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="208" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Pull server logs</text><text x="92" y="230" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">IPs, devices, timestamps and GCLIDs</tspan><tspan x="92" dy="19">for paid clicks.</tspan></text><circle cx="58" cy="289" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="294" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="309" y2="347" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="294" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Note the pattern</text><text x="92" y="316" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Campaigns, ad groups, keywords and</tspan><tspan x="92" dy="19">dates.</tspan></text><circle cx="58" cy="375" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="380" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="395" y2="433" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="380" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Submit the form</text><text x="92" y="402" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Click Quality Form with your</tspan><tspan x="92" dy="19">10-digit Customer ID.</tspan></text><circle cx="58" cy="461" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="466" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="466" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Watch for credits</text><text x="92" y="488" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Invalid activity adjustments under</tspan><tspan x="92" dy="19">Billing.</tspan></text><text x="404" y="549" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>