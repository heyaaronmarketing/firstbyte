<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 558" width="800" height="558" role="img" aria-labelledby="t507810"><title id="t507810">Six steps to lower Google Ads cost per click for businesses in Houston and The Woodlands</title><defs><linearGradient id="g507810" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar507810" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="557" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="557" rx="22" fill="url(#g507810)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Six ways to lower your Google Ads costs</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Roughly in order of how fast they pay off</tspan></text><circle cx="58" cy="132" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="137" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="152" y2="171" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="137" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Negatives</text><text x="92" y="159" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Cut jobs, DIY, how-to and wrong-town searches weekly.</tspan></text><circle cx="58" cy="199" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="204" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="219" y2="238" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="204" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Location</text><text x="92" y="226" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Switch to Presence and trim towns you don’t serve.</tspan></text><circle cx="58" cy="266" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="271" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="286" y2="305" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="271" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Schedule</text><text x="92" y="293" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Run when someone answers the phone.</tspan></text><circle cx="58" cy="333" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="338" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="353" y2="372" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="338" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Split by service</text><text x="92" y="360" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">One ad group and page per service.</tspan></text><circle cx="58" cy="400" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="405" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><line x1="58" x2="58" y1="420" y2="439" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="405" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Track leads</text><text x="92" y="427" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Calls and forms as conversions for smart bidding.</tspan></text><circle cx="58" cy="467" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="472" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">6</text><text x="92" y="472" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Test ads</text><text x="92" y="494" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Better CTR lowers what you pay per position.</tspan></text><text x="764" y="536" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>