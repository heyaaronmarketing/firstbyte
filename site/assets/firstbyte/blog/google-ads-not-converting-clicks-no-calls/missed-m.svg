<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 408" width="440" height="408" role="img" aria-labelledby="t150561"><title id="t150561">Bar chart of missed call costs when Google Ads calls go unanswered at a Spring, TX HVAC company</title><defs><linearGradient id="g150561" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar150561" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="407" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="407" rx="22" fill="url(#g150561)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">What missed ad calls cost</tspan><tspan x="36" dy="30">in a month</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">40 ad calls, 25% missed, 40% booked, $450</tspan><tspan x="36" dy="20">average job</tspan></text><text x="36" y="184" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Ad spend on missed calls</text><rect x="36" y="192" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="192" width="73.5" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="208" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$450</text><text x="36" y="246" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">Jobs lost from missed calls</text><rect x="36" y="254" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="254" width="294.0" height="22" rx="11" fill="url(#bar150561)"/><text x="344" y="270" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$1,800</text><text x="36" y="308" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">An answering service (example)</text><rect x="36" y="316" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="316" width="49.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="332" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">~$300</text><text x="36" y="386" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example</tspan></text><text x="404" y="386" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>