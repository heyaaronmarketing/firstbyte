<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 362" width="440" height="362" role="img" aria-labelledby="t331102"><title id="t331102">Bar chart of an illustrative Google Ads auction where higher Quality Score lowers cost per click for a Houston business</title><defs><linearGradient id="g331102" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar331102" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="361" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="361" rx="22" fill="url(#g331102)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Higher quality, lower</tspan><tspan x="36" dy="30">price</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Simplified auction model: actual CPC paid by</tspan><tspan x="36" dy="20">each advertiser</tspan></text><text x="36" y="184" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">A: bids $14, quality 8, ranks 1st</text><rect x="36" y="192" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="192" width="229.7" height="22" rx="11" fill="url(#bar331102)"/><text x="344" y="208" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$11.26</text><text x="36" y="246" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">B: bids $18, quality 5, ranks 2nd</text><rect x="36" y="254" width="294" height="22" rx="11" fill="rgba(255,