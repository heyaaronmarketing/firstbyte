<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 398" width="800" height="398" role="img" aria-labelledby="t737603"><title id="t737603">Timeline of Google Business Profile changes from 2024 to 2026 that affect Houston and The Woodlands businesses</title><defs><linearGradient id="g737603" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar737603" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="397" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="397" rx="22" fill="url(#g737603)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Google Business Profile changes, 2024-2026</tspan></text><circle cx="58" cy="106" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="111" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="126" y2="145" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="111" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">March 2024</text><text x="92" y="133" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Free Business Profile websites shut down and redirect to the profile.</tspan></text><circle cx="58" cy="173" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="178" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="193" y2="212" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="178" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">July 31, 2024</text><text x="92" y="200" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Chat and call history removed from profiles.</tspan></text><circle cx="58" cy="240" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="245" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="260" y2="279" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="245" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">2025</text><text x="92" y="267" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Public Q&amp;A pulled back; an AI Ask feature in Maps answers questions instead.</tspan></text><circle cx="58" cy="307" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="312" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><text x="92" y="312" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">April 2026</text><text x="92" y="334" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Review policy adds limits on staff review quotas and scripted content.</tspan></text><text x="764" y="376" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>