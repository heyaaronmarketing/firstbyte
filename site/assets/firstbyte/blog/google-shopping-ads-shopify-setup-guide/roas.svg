<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 402" width="800" height="402" role="img" aria-labelledby="t720059"><title id="t720059">Bar chart of break-even ROAS by gross margin for Google Shopping ads on Shopify stores</title><defs><linearGradient id="g720059" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar720059" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="401" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="401" rx="22" fill="url(#g720059)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Break-even ROAS by gross margin</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Below these numbers, the first order loses money</tspan></text><text x="36" y="136" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">25% margin</tspan></text><rect x="300" y="120" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="120" width="380.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="136" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4.0x</text><text x="36" y="182" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="36" dy="0">40% margin</tspan></text><rect x="300" y="166" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="166" width="237.5" height="22" rx="11" fill="url(