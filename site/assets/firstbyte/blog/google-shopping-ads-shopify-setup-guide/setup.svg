<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 491" width="800" height="491" role="img" aria-labelledby="t278448"><title id="t278448">Steps for setting up Google Shopping ads for Shopify through the Google and YouTube app and Merchant Center</title><defs><linearGradient id="g278448" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar278448" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="490" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="490" rx="22" fill="url(#g278448)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Shopify to Google Shopping setup</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">The order that avoids most first-week errors</tspan></text><circle cx="58" cy="132" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="137" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="152" y2="171" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="137" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Install the Google &amp; YouTube app</text><text x="92" y="159" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">From the Shopify App Store, using a Google login with admin rights.</tspan></text><circle cx="58" cy="199" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="204" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="219" y2="238" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="204" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Link a standalone Merchant Center</text><text x="92" y="226" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Multi-client accounts can’t link to the app.</tspan></text><circle cx="58" cy="266" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="271" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="286" y2="305" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="271" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Fix the store basics</text><text x="92" y="293" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Remove the password; add refund policy, terms and contact info.</tspan></text><circle cx="58" cy="333" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="338" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="353" y2="372" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="338" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Verify, then set shipping</text><text x="92" y="360" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Confirm the business phone; match shipping costs to checkout.</tspan></text><circle cx="58" cy="400" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="405" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="405" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Connect Google Ads and conversions</text><text x="92" y="427" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Map purchase, add_to_cart and begin_checkout; enable Enhanced Conversions.</tspan></text><text x="764" y="469" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>