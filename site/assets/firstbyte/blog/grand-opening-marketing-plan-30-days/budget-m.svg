<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 486" width="440" height="486" role="img" aria-labelledby="t318882"><title id="t318882">Bar chart of an illustrative grand opening ad budget split for a small business in The Woodlands and Houston</title><defs><linearGradient id="g318882" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar318882" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="485" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="485" rx="22" fill="url(#g318882)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">How we’d split a $3,000</tspan><tspan x="36" dy="30">opening ad budget</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Six weeks around opening day, small consumer</tspan><tspan x="36" dy="20">business</tspan></text><text x="36" y="184" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">Meta waitlist and RSVP ads</text><rect x="36" y="192" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="192" width="294.0" height="22" rx="11" fill="url(#bar318882)"/><text x="344" y="208" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$1,200</text><text x="36" y="246" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Google Search (brand + category)</text><rect x="36" y="254" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="254" width="220.5" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="270" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$900</text><text x="36" y="308" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Creator clips run as ads</text><rect x="36" y="316" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="316" width="122.5" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="332" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$500</text><text x="36" y="370" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Retargeting after opening</text><rect x="36" y="378" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="378" width="98.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="394" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$400</text><text x="36" y="448" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example. The offer itself,</tspan><tspan x="36" dy="16">printing and the event are separate costs.</tspan></text><text x="404" y="464" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>