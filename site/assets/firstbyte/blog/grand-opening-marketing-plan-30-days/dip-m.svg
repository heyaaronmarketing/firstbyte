<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 416" width="440" height="416" role="img" aria-labelledby="t86120"><title id="t86120">Column chart showing the week-three traffic dip after a grand opening in The Woodlands and Houston</title><defs><linearGradient id="g86120" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar86120" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="415" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="415" rx="22" fill="url(#g86120)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">The week-three dip</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Weekly visits after a typical opening, as a</tspan><tspan x="36" dy="20">share of opening week</tspan></text><line x1="70" x2="404" y1="320.0" y2="320.0" stroke="rgba(255,255,255,.09)"/><line x1="70" x2="404" y1="231.0" y2="231.0" stroke="rgba(255,255,255,.09)"/><line x1="70" x2="404" y1="142.0" y2="142.0" stroke="rgba(255,255,255,.09)"/><text x="56" y="231" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle" transform="rotate(-90 56 231)">Visits</text><rect x="80.0" y="142.0" width="35.6" height="178.0" rx="6" fill="rgba(255,255,255,.14)"/><text x="97.8" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Week 1</text><rect x="135.7" y="181.2" width="35.6" height="138.8" rx="6" fill="rgba(255,255,255,.14)"/><text x="153.5" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Week 2</text><rect x="191.4" y="222.1" width="35.6" height="97.9" rx="6" fill="url(#bar86120)"/><text x="209.2" y="342" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600">Week 3</text><rect x="247.0" y="209.6" width="35.6" height="110.4" rx="6" fill="rgba(255,255,255,.14)"/><text x="264.8" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Week 4</text><rect x="302.7" y="195.4" width="35.6" height="124.6" rx="6" fill="rgba(255,255,255,.14)"/><text x="320.5" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Week 6</text><rect x="358.4" y="188.3" width="35.6" height="131.7" rx="6" fill="rgba(255,255,255,.14)"/><text x="376.2" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Week 8</text><text x="36" y="378" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example of the pattern, not a</tspan><tspan x="36" dy="16">benchmark.</tspan></text><text x="404" y="394" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>