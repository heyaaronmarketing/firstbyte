<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 510" width="440" height="510" role="img" aria-labelledby="t457973"><title id="t457973">Statistics on gym member retention and Houston summer heat for fitness studio owners in The Woodlands</title><defs><linearGradient id="g457973" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar457973" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="509" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="509" rx="22" fill="url(#g457973)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Why retention pays for</tspan><tspan x="36" dy="30">gyms</tspan></text><rect x="36" y="120" width="368" height="76" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="171" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">1/3</text><text x="186" y="154" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">of members lost each year</tspan><tspan x="186" dy="19">(HFA)</tspan></text><rect x="36" y="208" width="368" height="76" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="259" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">+7 mo</text><text x="186" y="242" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">longer stay at 4+ visits a</tspan><tspan x="186" dy="19">month</tspan></text><rect x="36" y="296" width="368" height="76" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="347" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">5–25x</text><text x="186" y="330" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">cost to win vs. keep a</tspan><tspan x="186" dy="19">customer</tspan></text><rect x="36" y="384" width="368" height="76" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="435" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">94.9°</text><text x="186" y="427" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">average August high at IAH</tspan></text><text x="36" y="488" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Sources: ABC Fitness, HBR, NWS</tspan></text><text x="404" y="488" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>