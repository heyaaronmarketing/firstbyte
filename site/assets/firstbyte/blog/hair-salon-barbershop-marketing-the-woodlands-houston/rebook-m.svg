<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 486" width="440" height="486" role="img" aria-labelledby="t490608"><title id="t490608">Bar chart of annual client value by rebooking frequency for a hair salon or barbershop in Houston and The Woodlands</title><defs><linearGradient id="g490608" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar490608" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="485" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="485" rx="22" fill="url(#g490608)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Why rebooking beats</tspan><tspan x="36" dy="30">new-client ads</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">One client, $85 average ticket, visits in a</tspan><tspan x="36" dy="20">year</tspan></text><text x="36" y="184" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Never returns</text><rect x="36" y="192" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="192" width="22.6" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="208" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$85</text><text x="36" y="246" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Every 10 weeks</text><rect x="36" y="254" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="254" width="113.1" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="270" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$425</text><text x="36" y="308" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">Every 7 weeks</text><rect x="36" y="316" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="316" width="158.3" height="22" rx="11" fill="url(#bar490608)"/><text x="344" y="332" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$595</text><text x="36" y="370" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Every 4 weeks (barber)</text><rect x="36" y="378" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="378" width="294.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="394" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$1,105</text><text x="36" y="448" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example. Ticket and frequency</tspan><tspan x="36" dy="16">vary by service</tspan></text><text x="404" y="464" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>