<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 567" width="440" height="567" role="img" aria-labelledby="t953845"><title id="t953845">Five-step plan to clean up website tracking for HIPAA-compliant marketing at Houston and The Woodlands practices</title><defs><linearGradient id="g953845" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar953845" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="566" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="566" rx="22" fill="url(#g953845)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A 30-day tracking cleanup</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">In the order we’d do it</tspan></text><circle cx="58" cy="132" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="137" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="152" y2="190" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="137" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Week 1: inventory</text><text x="92" y="159" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">List every third-party tag on key</tspan><tspan x="92" dy="19">pages and flows.</tspan></text><circle cx="58" cy="218" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="223" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="238" y2="276" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="223" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Week 2: remove</text><text x="92" y="245" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Pull tags from portal, booking,</tspan><tspan x="92" dy="19">intake, confirmation.</tspan></text><circle cx="58" cy="304" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="309" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="324" y2="362" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="309" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Week 3: vendors</text><text x="92" y="331" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Get BAAs from anyone touching PHI.</tspan><tspan x="92" dy="19">Drop refusers.</tspan></text><circle cx="58" cy="390" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="395" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="410" y2="448" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="395" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Week 4: rebuild</text><text x="92" y="417" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Non-clinical conversions, Texas</tspan><tspan x="92" dy="19">consent, review script.</tspan></text><circle cx="58" cy="476" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="481" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="481" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Every 6 months</text><text x="92" y="503" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Rescan. Plugins and vendors change.</tspan></text><text x="404" y="545" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>