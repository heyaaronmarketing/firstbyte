<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 741" width="440" height="741" role="img" aria-labelledby="t761609"><title id="t761609">Timeline of HIPAA tracking pixel guidance and the 2024 Texas ruling for Houston and The Woodlands healthcare marketing</title><defs><linearGradient id="g761609" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar761609" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="740" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="740" rx="22" fill="url(#g761609)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">How the pixel rules moved,</tspan><tspan x="36" dy="30">2022 to 2025</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">The guidance Houston practices have been</tspan><tspan x="36" dy="20">reacting to</tspan></text><circle cx="58" cy="182" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="187" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="202" y2="259" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="187" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Late 2022</text><text x="92" y="209" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">OCR bulletin: tracking that</tspan><tspan x="92" dy="19">discloses PHI to vendors is</tspan><tspan x="92" dy="19">impermissible.</tspan></text><circle cx="58" cy="287" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="292" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="307" y2="345" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="292" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">July 2023</text><text x="92" y="314" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">FTC and OCR warn about 130 hospitals</tspan><tspan x="92" dy="19">and telehealth providers by letter.</tspan></text><circle cx="58" cy="373" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="378" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="393" y2="431" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="378" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">March 2024</text><text x="92" y="400" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">OCR updates the bulletin with more</tspan><tspan x="92" dy="19">examples.</tspan></text><circle cx="58" cy="459" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="464" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="479" y2="517" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="464" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">June 20, 2024</text><text x="92" y="486" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Texas federal court vacates the</tspan><tspan x="92" dy="19">IP-plus-public-page theory.</tspan></text><circle cx="58" cy="545" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="550" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><line x1="58" x2="58" y1="565" y2="603" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="550" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Aug. 29, 2024</text><text x="92" y="572" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">OCR drops its appeal. The rest of</tspan><tspan x="92" dy="19">the guidance stands.</tspan></text><circle cx="58" cy="631" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="636" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">6</text><text x="92" y="636" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">January 2025</text><text x="92" y="658" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Meta starts restricting health</tspan><tspan x="92" dy="19">advertisers’ data and events.</tspan></text><text x="404" y="719" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>