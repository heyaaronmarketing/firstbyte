<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 674" width="440" height="674" role="img" aria-labelledby="t954629"><title id="t954629">Five-step 90-day marketing plan for a home inspector in The Woodlands and Houston</title><defs><linearGradient id="g954629" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar954629" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="673" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="673" rx="22" fill="url(#g954629)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A 90-day plan for a small</tspan><tspan x="36" dy="30">inspection company</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">For a team in The Woodlands that mostly runs</tspan><tspan x="36" dy="20">on agent referrals</tspan></text><circle cx="58" cy="182" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="187" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="202" y2="259" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="187" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 1-14</text><text x="92" y="209" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Fix the profile, license number</tspan><tspan x="92" dy="19">placement, DBA registration and</tspan><tspan x="92" dy="19">booking link.</tspan></text><circle cx="58" cy="287" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="292" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="307" y2="345" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="292" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 15-30</text><text x="92" y="314" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Publish prices, a sample report and</tspan><tspan x="92" dy="19">add-on pages. Start review texts.</tspan></text><circle cx="58" cy="373" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="378" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="393" y2="431" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="378" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 31-60</text><text x="92" y="400" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Launch search ads with negatives.</tspan><tspan x="92" dy="19">Start the LSA sign-up.</tspan></text><circle cx="58" cy="459" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="464" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="479" y2="517" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="464" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 61-75</text><text x="92" y="486" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Write two Houston posts: clay</tspan><tspan x="92" dy="19">foundations and flood clues.</tspan></text><circle cx="58" cy="545" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="550" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="550" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 76-90</text><text x="92" y="572" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Pitch pre-listing and new-build</tspan><tspan x="92" dy="19">inspections. Judge channels by cost</tspan><tspan x="92" dy="19">per booking.</tspan></text><text x="404" y="652" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>