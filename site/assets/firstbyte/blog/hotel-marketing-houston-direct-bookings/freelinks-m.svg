<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 742" width="440" height="742" role="img" aria-labelledby="t543122"><title id="t543122">Steps for a Houston hotel to set up Google free booking links through its booking engine and Hotel Center</title><defs><linearGradient id="g543122" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar543122" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="741" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="741" rx="22" fill="url(#g543122)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Get your hotel into</tspan><tspan x="36" dy="30">Google’s free booking</tspan><tspan x="36" dy="30">links</tspan></text><text x="36" y="138" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Usually a one-time setup through your booking</tspan><tspan x="36" dy="20">engine</tspan></text><circle cx="58" cy="212" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="217" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="232" y2="289" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="217" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Ask your booking engine</text><text x="92" y="239" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Confirm it connects your rates to</tspan><tspan x="92" dy="19">Google Hotel Center as a</tspan><tspan x="92" dy="19">connectivity partner.</tspan></text><circle cx="58" cy="317" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="322" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="337" y2="394" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="322" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Match your profile</text><text x="92" y="344" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Make sure the Hotel Center listing</tspan><tspan x="92" dy="19">matches your Google Business</tspan><tspan x="92" dy="19">Profile.</tspan></text><circle cx="58" cy="422" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="427" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="442" y2="480" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="427" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Check rate parity</text><text x="92" y="449" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Your direct rate should never show</tspan><tspan x="92" dy="19">higher than the OTAs next to it.</tspan></text><circle cx="58" cy="508" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="513" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="528" y2="585" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="513" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Test it</text><text x="92" y="535" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Search your hotel name, pick dates</tspan><tspan x="92" dy="19">and confirm your site appears in</tspan><tspan x="92" dy="19">prices.</tspan></text><circle cx="58" cy="613" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="618" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="618" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Track it</text><text x="92" y="640" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Tag booking engine traffic so you</tspan><tspan x="92" dy="19">see revenue from Google in</tspan><tspan x="92" dy="19">Analytics.</tspan></text><text x="404" y="720" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>