28)"/><text x="344" y="250" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$445</text><text x="36" y="288" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">GDS</text><rect x="36" y="296" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="296" width="223.3" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="312" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$392</text><text x="36" y="350" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">OTAs</text><rect x="36" y="358" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="358" width="177.8" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="374" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$312</text><text x="36" y="428" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Source: SiteMinder via PhocusWire</tspan></text><text x="404" y="428" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>