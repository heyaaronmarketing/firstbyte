<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 402" width="800" height="402" role="img" aria-labelledby="t207503"><title id="t207503">Bar chart comparing one-year revenue from recurring and one-time house cleaning clients in Houston</title><defs><linearGradient id="g207503" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar207503" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="401" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="401" rx="22" fill="url(#g207503)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">One-year revenue per client by service type</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Illustrative Houston pricing, one client, first 12 months</tspan></text><text x="36" y="136" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">Weekly at $140</tspan></text><rect x="300" y="120" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="120" width="380.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="136" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$7,280</text><text x="36" y="182" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="36" dy="0">Biweekly at $160</tspan></text><rect x="300" y="166" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="166" width="217.1" height="22" rx="11" fill="url(#bar207503)"/><text x="694" y="182" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$4,160</text><text x="36" y="228" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">Monthly at $190</tspan></text><rect x="300" y="212" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="212" width="119.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="228" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$2,280</text><text x="36" y="274" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">Move-out clean</tspan></text><rect x="300" y="258" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="258" width="19.8" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="274" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$380</text><text x="36" y="320" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">One-time deep clean</tspan></text><rect x="300" y="304" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="304" width="16.7" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="320" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$320</text><text x="36" y="380" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example. Assumes the client stays all year; real retention is lower.</tspan></text><text x="764" y="380" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>