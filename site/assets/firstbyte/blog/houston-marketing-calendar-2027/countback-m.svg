<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 692" width="440" height="692" role="img" aria-labelledby="t98356"><title id="t98356">Six-step timeline for planning seasonal marketing campaigns for Houston and The Woodlands businesses</title><defs><linearGradient id="g98356" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar98356" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="691" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="691" rx="22" fill="url(#g98356)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Count back from the date</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Our usual timeline for a seasonal campaign in</tspan><tspan x="36" dy="20">Houston</tspan></text><circle cx="58" cy="152" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="157" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="172" y2="210" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="157" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">8 weeks out</text><text x="92" y="179" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Pick the offer and the audience.</tspan><tspan x="92" dy="19">Write it in one sentence.</tspan></text><circle cx="58" cy="238" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="243" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="258" y2="296" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="243" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">6 weeks out</text><text x="92" y="265" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Brief the creative: photos, video,</tspan><tspan x="92" dy="19">ad copy, email.</tspan></text><circle cx="58" cy="324" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="329" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="344" y2="382" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="329" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">4 weeks out</text><text x="92" y="351" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Build the landing page and ad</tspan><tspan x="92" dy="19">campaigns; set up tracking.</tspan></text><circle cx="58" cy="410" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="415" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="430" y2="468" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="415" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">2 weeks out</text><text x="92" y="437" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Launch warm-up ads, posts and the</tspan><tspan x="92" dy="19">first email.</tspan></text><circle cx="58" cy="496" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="501" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><line x1="58" x2="58" y1="516" y2="554" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="501" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">The date</text><text x="92" y="523" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Main push, updated Business Profile</tspan><tspan x="92" dy="19">hours, staff ready.</tspan></text><circle cx="58" cy="582" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="587" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">6</text><text x="92" y="587" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">1 week after</text><text x="92" y="609" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Review requests, thank-you email,</tspan><tspan x="92" dy="19">notes for 2028.</tspan></text><text x="404" y="670" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>