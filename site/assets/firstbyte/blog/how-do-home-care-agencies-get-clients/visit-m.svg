<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 703" width="440" height="703" role="img" aria-labelledby="t886396"><title id="t886396">Five steps for a home care agency to win referrals from hospital case managers and discharge planners in The Woodlands</title><defs><linearGradient id="g886396" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar886396" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="702" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="702" rx="22" fill="url(#g886396)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A first visit to a</tspan><tspan x="36" dy="30">hospital case management</tspan><tspan x="36" dy="30">team</tspan></text><text x="36" y="138" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">How we’d approach one near The Woodlands</tspan></text><circle cx="58" cy="192" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="197" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="212" y2="269" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="197" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Register as a vendor</text><text x="92" y="219" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Call the department and follow the</tspan><tspan x="92" dy="19">hospital’s vendor check-in rules</tspan><tspan x="92" dy="19">before visiting.</tspan></text><circle cx="58" cy="297" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="302" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="317" y2="374" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="302" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Bring proof, not swag</text><text x="92" y="324" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">License number, insurance, caregiver</tspan><tspan x="92" dy="19">screening and training, real minimum</tspan><tspan x="92" dy="19">shift.</tspan></text><circle cx="58" cy="402" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="407" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="422" y2="460" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="407" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">State what you don’t do</text><text x="92" y="429" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Explain the line between personal</tspan><tspan x="92" dy="19">assistance and skilled home health.</tspan></text><circle cx="58" cy="488" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="493" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="508" y2="546" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="493" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Give one direct number</text><text x="92" y="515" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">A line that a person answers</tspan><tspan x="92" dy="19">evenings and weekends.</tspan></text><circle cx="58" cy="574" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="579" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="579" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Follow up after a start</text><text x="92" y="601" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">With family permission, confirm the</tspan><tspan x="92" dy="19">caregiver arrived and the first</tspan><tspan x="92" dy="19">shift went well.</tspan></text><text x="404" y="681" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>