<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 548" width="800" height="548" role="img" aria-labelledby="t886396"><title id="t886396">Five steps for a home care agency to win referrals from hospital case managers and discharge planners in The Woodlands</title><defs><linearGradient id="g886396" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar886396" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="547" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="547" rx="22" fill="url(#g886396)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A first visit to a hospital case management team</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">How we’d approach one near The Woodlands</tspan></text><circle cx="58" cy="132" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="137" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="152" y2="190" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="137" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Register as a vendor</text><text x="92" y="159" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Call the department and follow the hospital’s vendor check-in rules before</tspan><tspan x="92" dy="19">visiting.</tspan></text><circle cx="58" cy="218" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="223" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="238" y2="276" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="223" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Bring proof, not swag</text><text x="92" y="245" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">License number, insurance, caregiver screening and training, real minimum</tspan><tspan x="92" dy="19">shift.</tspan></text><circle cx="58" cy="304" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="309" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="324" y2="343" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="309" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">State what you don’t do</text><text x="92" y="331" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Explain the line between personal assistance and skilled home health.</tspan></text><circle cx="58" cy="371" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="376" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="391" y2="410" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="376" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Give one direct number</text><text x="92" y="398" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">A line that a person answers evenings and weekends.</tspan></text><circle cx="58" cy="438" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="443" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="443" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Follow up after a start</text><text x="92" y="465" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">With family permission, confirm the caregiver arrived and the first shift went</tspan><tspan x="92" dy="19">well.</tspan></text><text x="764" y="526" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>