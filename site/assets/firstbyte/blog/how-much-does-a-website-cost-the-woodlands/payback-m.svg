<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 532" width="440" height="532" role="img" aria-labelledby="t135982"><title id="t135982">Funnel showing how a new website can pay back its cost for a home service business in Spring and The Woodlands</title><defs><linearGradient id="g135982" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar135982" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="531" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="531" rx="22" fill="url(#g135982)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">How a better site pays for</tspan><tspan x="36" dy="30">itself</tspan></text><rect x="36" y="120" width="368" height="64" rx="12" fill="#01f6f2" fill-opacity="0.20" stroke="#01f6f2" stroke-opacity="0.60"/><text x="220" y="146" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="220" dy="0">1,200 monthly visits</tspan></text><text x="220" y="168" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">same traffic</text><rect x="45" y="192" width="350" height="64" rx="12" fill="#01f6f2" fill-opacity="0.18" stroke="#01f6f2" stroke-opacity="0.53"/><text x="220" y="218" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="220" dy="0">Conversion rises 2% to 4%</tspan></text><text x="220" y="240" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">+24 leads</text><rect x="54" y="264" width="331" height="64" rx="12" fill="#01f6f2" fill-opacity="0.16" stroke="#01f6f2" stroke-opacity="0.46"/><text x="220" y="290" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="220" dy="0">40% of new leads book</tspan></text><text x="220" y="312" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">+10 jobs</text><rect x="64" y="336" width="313" height="64" rx="12" fill="#01f6f2" fill-opacity="0.14" stroke="#01f6f2" stroke-opacity="0.38"/><text x="220" y="362" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="220" dy="0">Average job $650</tspan></text><text x="220" y="384" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">+$6,500</text><rect x="73" y="408" width="294" height="64" rx="12" fill="#01f6f2" fill-opacity="0.12" stroke="#01f6f2" stroke-opacity="0.31"/><text x="220" y="434" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="220" dy="0">$10,000 build cost</tspan></text><text x="220" y="456" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">~2 months</text><text x="36" y="494" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example. Use your own traffic,</tspan><tspan x="36" dy="16">close rate and job value.</tspan></text><text x="404" y="510" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-