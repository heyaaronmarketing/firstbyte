<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 643" width="440" height="643" role="img" aria-labelledby="t570354"><title id="t570354">Stats on yearly website running costs for Houston and The Woodlands businesses, including domain, platform and Texas sales tax</title><defs><linearGradient id="g570354" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar570354" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="642" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="642" rx="22" fill="url(#g570354)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">The yearly bill after</tspan><tspan x="36" dy="30">launch</tspan></text><rect x="36" y="120" width="368" height="110" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="166" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">$10.97</text><text x="56" y="192" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="56" dy="0">.com wholesale price per year from Nov 1,</tspan><tspan x="56" dy="19">2026</tspan></text><rect x="36" y="242" width="368" height="110" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="288" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">$348</text><text x="56" y="314" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="56" dy="0">a year for Squarespace Core billed</tspan><tspan x="56" dy="19">annually</tspan></text><rect x="36" y="364" width="368" height="110" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="410" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">$29/mo</text><text x="56" y="436" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="56" dy="0">Shopify Basic billed yearly, plus card</tspan><tspan x="56" dy="19">fees</tspan></text><rect x="36" y="486" width="368" height="91" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="532" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">8.25%</text><text x="56" y="558" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="56" dy="0">top combined Texas sales tax rate</tspan></text><text x="36" y="605" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Sources: Verisign via webhosting.today,</tspan><tspan x="36" dy="16">Squarespace, Shopify, Texas Comptroller</tspan></text><text x="404" y="621" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>