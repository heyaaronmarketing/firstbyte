<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 518" width="440" height="518" role="img" aria-labelledby="t887602"><title id="t887602">Bar chart of website cost tiers for small businesses in The Woodlands and Houston, from DIY builders to ecommerce</title><defs><linearGradient id="g887602" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar887602" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="517" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="517" rx="22" fill="url(#g887602)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Website build cost by tier</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Midpoint of typical quotes we see in Houston</tspan><tspan x="36" dy="20">and The Woodlands</tspan></text><text x="36" y="154" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">DIY builder (first year)</text><rect x="36" y="162" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="162" width="8.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="178" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$700</text><text x="36" y="216" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Freelancer template</text><rect x="36" y="224" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="224" width="24.9" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="240" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$2,750</text><text x="36" y="278" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Small agency starter</text><rect x="36" y="286" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="286" width="54.3" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="302" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$6,000</text><text x="36" y="340" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">Service business build</text><rect x="36" y="348" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="348" width="117.6" height="22" rx="11" fill="url(#bar887602)"/><text x="344" y="364" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$13,000</text><text x="36" y="402" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Ecommerce or custom</text><rect x="36" y="410" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="410" width="294.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="426" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$32,500</text><text x="36" y="480" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example based on our experience,</tspan><tspan x="36" dy="16">not a survey</tspan></text><text x="404" y="496" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial,