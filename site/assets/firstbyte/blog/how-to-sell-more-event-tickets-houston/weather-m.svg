<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 654" width="440" height="654" role="img" aria-labelledby="t971324"><title id="t971324">Step-by-step outdoor event weather plan for promoters selling event tickets in Houston and The Woodlands</title><defs><linearGradient id="g971324" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar971324" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="653" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="653" rx="22" fill="url(#g971324)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A weather plan buyers can</tspan><tspan x="36" dy="30">see</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">For outdoor events in Greater Houston</tspan></text><circle cx="58" cy="162" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="167" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="182" y2="239" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="167" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Publish the policy at on-sale</text><text x="92" y="189" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">State rain, lightning and reschedule</tspan><tspan x="92" dy="19">rules on the ticket page and in the</tspan><tspan x="92" dy="19">FAQ.</tspan></text><circle cx="58" cy="267" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="272" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="287" y2="325" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="272" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Watch the 5-day forecast</text><text x="92" y="294" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Hold the 10% reserve until you know</tspan><tspan x="92" dy="19">which way the weekend is going.</tspan></text><circle cx="58" cy="353" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="358" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="373" y2="430" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="358" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Prewrite every message</text><text x="92" y="380" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Delay, reschedule and cancel</tspan><tspan x="92" dy="19">versions for email, SMS opt-ins and</tspan><tspan x="92" dy="19">social.</tspan></text><circle cx="58" cy="458" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="463" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="478" y2="516" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="463" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Pause ads and update schema</text><text x="92" y="485" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Stop spend fast and set eventStatus</tspan><tspan x="92" dy="19">so Google shows the change.</tspan></text><circle cx="58" cy="544" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="549" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="549" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Follow the 30-minute rule</text><text x="92" y="571" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Resume only 30 minutes after the</tspan><tspan x="92" dy="19">last thunder, per the NWS.</tspan></text><text x="404" y="632" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>