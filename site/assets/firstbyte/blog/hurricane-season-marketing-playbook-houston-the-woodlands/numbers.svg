<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 293" width="800" height="293" role="img" aria-labelledby="t519464"><title id="t519464">Statistics on Hurricane Beryl power and cell outages and Hurricane Harvey rainfall and damage in the Houston area</title><defs><linearGradient id="g519464" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar519464" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="292" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="292" rx="22" fill="url(#g519464)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Beryl and Harvey by the numbers</tspan></text><rect x="36" y="90" width="170" height="153" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="148" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">2.26M</text><text x="56" y="178" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="56" dy="0">CenterPoint outages</tspan><tspan x="56" dy="19">after Beryl</tspan></text><rect x="222" y="90" width="170" height="153" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="242" y="148" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">1,335</text><text x="242" y="178" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="242" dy="0">cell sites down in</tspan><tspan x="242" dy="19">the six-county area,</tspan><tspan x="242" dy="19">July 9, 2024</tspan></text><rect x="408" y="90" width="170" height="153" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="428" y="148" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">60.58&quot;</text><text x="428" y="178" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="428" dy="0">Harvey’s peak</tspan><tspan x="428" dy="19">rainfall, Nederland</tspan></text><rect x="594" y="90" width="170" height="153" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="614" y="148" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">$125B</text><text x="614" y="178" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="614" dy="0">Harvey damage</tspan><tspan x="614" dy="19">estimate</tspan></text><text x="36" y="271" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Source: Texas Tribune, FCC data via RCR Wireless, NHC via NPR</tspan></text><text x="764" y="271" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>