<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 443" width="800" height="443" role="img" aria-labelledby="t306126"><title id="t306126">Four-phase hurricane season marketing plan for Houston and The Woodlands businesses from 72 hours before landfall to recovery</title><defs><linearGradient id="g306126" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar306126" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="442" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="442" rx="22" fill="url(#g306126)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">The four phases of a hurricane marketing plan</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">What to do, in order, from the first cone to the last cleanup crew</tspan></text><circle cx="58" cy="132" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="137" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="152" y2="190" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="137" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">72 hours before</text><text x="92" y="159" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Staff plan, special hours set, ads and scheduled posts paused, one customer</tspan><tspan x="92" dy="19">notice.</tspan></text><circle cx="58" cy="218" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="223" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="238" y2="257" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="223" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">During the storm</text><text x="92" y="245" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">One pinned update, profile accurate, answer DMs, no promos.</tspan></text><circle cx="58" cy="285" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="290" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="305" y2="324" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="290" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">First week after</text><text x="92" y="312" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Reopen the profile, post real hours, restart ads only where you can serve.</tspan></text><circle cx="58" cy="352" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="357" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><text x="92" y="357" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Recovery</text><text x="92" y="379" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Give specifically, ease back into offers once most of the metro has power.</tspan></text><text x="764" y="421" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>