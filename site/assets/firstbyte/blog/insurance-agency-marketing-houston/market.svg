" dy="19">2016</tspan></text><rect x="408" y="90" width="170" height="153" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="428" y="148" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">18.7%</text><text x="428" y="178" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="428" dy="0">average rate change</tspan><tspan x="428" dy="19">in 2024</tspan></text><rect x="594" y="90" width="170" height="153" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="614" y="148" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">-4.0%</text><text x="614" y="178" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="614" dy="0">average filed</tspan><tspan x="614" dy="19">change, Aug to Oct</tspan><tspan x="614" dy="19">2026</tspan></text><text x="36" y="271" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Source: Texas Department of Insurance</tspan></text><text x="764" y="271" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>