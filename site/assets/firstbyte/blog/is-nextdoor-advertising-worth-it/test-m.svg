<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 672" width="440" height="672" role="img" aria-labelledby="t261189"><title id="t261189">Six-step 60-day plan for testing whether Nextdoor advertising is worth it for a business in The Woodlands</title><defs><linearGradient id="g261189" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar261189" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="671" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="671" rx="22" fill="url(#g261189)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A 60-day Nextdoor ads test</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Judge it on booked jobs, not clicks</tspan></text><circle cx="58" cy="132" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="137" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="152" y2="190" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="137" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Claim and fill the page</text><text x="92" y="159" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Real photos, categories neighbors</tspan><tspan x="92" dy="19">use, your own neighborhood included.</tspan></text><circle cx="58" cy="218" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="223" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="238" y2="276" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="223" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Collect recommendations</text><text x="92" y="245" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Ask 20 nearby customers before</tspan><tspan x="92" dy="19">spending anything.</tspan></text><circle cx="58" cy="304" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="309" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="324" y2="362" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="309" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Wire up tracking</text><text x="92" y="331" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Call tracking number, UTM links and</tspan><tspan x="92" dy="19">a Nextdoor-only promo code.</tspan></text><circle cx="58" cy="390" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="395" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="410" y2="448" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="395" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Run one offer</text><text x="92" y="417" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Fixed daily budget on a few ZIP</tspan><tspan x="92" dy="19">codes for the full 60 days.</tspan></text><circle cx="58" cy="476" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="481" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><line x1="58" x2="58" y1="496" y2="534" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="481" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Score every lead</text><text x="92" y="503" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Tag each call or message as booked,</tspan><tspan x="92" dy="19">quote only, or junk.</tspan></text><circle cx="58" cy="562" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="567" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">6</text><text x="92" y="567" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Compare and decide</text><text x="92" y="589" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Cost per booked job against Google</tspan><tspan x="92" dy="19">and Meta. Keep, trim or stop.</tspan></text><text x="404" y="650" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>