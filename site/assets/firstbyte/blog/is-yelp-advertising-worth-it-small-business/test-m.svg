<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 729" width="440" height="729" role="img" aria-labelledby="t718673"><title id="t718673">Six-step plan for testing whether Yelp advertising is worth it for a small business in The Woodlands over 90 days</title><defs><linearGradient id="g718673" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar718673" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="728" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="728" rx="22" fill="url(#g718673)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A 90-day Yelp ads test</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Measure booked jobs, not Yelp’s lead count</tspan></text><circle cx="58" cy="132" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="137" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="152" y2="209" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="137" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Record a baseline</text><text x="92" y="159" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Log free Yelp calls, messages and</tspan><tspan x="92" dy="19">quote requests for 60 days before</tspan><tspan x="92" dy="19">ads.</tspan></text><circle cx="58" cy="237" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="242" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="257" y2="314" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="242" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Fix the page</text><text x="92" y="264" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Fresh photos, accurate hours and</tspan><tspan x="92" dy="19">service areas, replies to recent</tspan><tspan x="92" dy="19">reviews.</tspan></text><circle cx="58" cy="342" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="347" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="362" y2="400" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="347" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Track separately</text><text x="92" y="369" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Dedicated call tracking number and</tspan><tspan x="92" dy="19">UTM-tagged website link on Yelp.</tspan></text><circle cx="58" cy="428" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="433" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="448" y2="486" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="433" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Run a fixed budget</text><text x="92" y="455" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Same monthly cap for 90 days,</tspan><tspan x="92" dy="19">targeted to the ZIP codes you serve.</tspan></text><circle cx="58" cy="514" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="519" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><line x1="58" x2="58" y1="534" y2="591" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="519" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Score every lead</text><text x="92" y="541" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Mark each call as real prospect,</tspan><tspan x="92" dy="19">spam, or existing customer, with job</tspan><tspan x="92" dy="19">value.</tspan></text><circle cx="58" cy="619" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="624" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">6</text><text x="92" y="624" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Compare and decide</text><text x="92" y="646" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Cost per booked job on Yelp vs</tspan><tspan x="92" dy="19">Google. Keep, trim or cancel.</tspan></text><text x="404" y="707" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>