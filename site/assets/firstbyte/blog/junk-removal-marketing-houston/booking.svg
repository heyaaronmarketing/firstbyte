<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 491" width="800" height="491" role="img" aria-labelledby="t908599"><title id="t908599">Five-step junk removal booking flow for Houston customers from photo quote to booked job and review</title><defs><linearGradient id="g908599" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar908599" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="490" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="490" rx="22" fill="url(#g908599)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">From photo to booked truck</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">A booking flow that beats a callback</tspan></text><circle cx="58" cy="132" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="137" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="152" y2="171" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="137" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Text photos</text><text x="92" y="159" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Customer texts photos from any page or ad.</tspan></text><circle cx="58" cy="199" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="204" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="219" y2="238" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="204" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Price range</text><text x="92" y="226" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Reply with a volume-based range within minutes.</tspan></text><circle cx="58" cy="266" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="271" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="286" y2="305" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="271" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Book a window</text><text x="92" y="293" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Online booking link with two-hour arrival windows.</tspan></text><circle cx="58" cy="333" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="338" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="353" y2="372" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="338" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Confirm on site</text><text x="92" y="360" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Final price confirmed in writing before loading.</tspan></text><circle cx="58" cy="400" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><tex