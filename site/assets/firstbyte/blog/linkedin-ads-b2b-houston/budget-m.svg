<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" width="440" height="470" role="img" aria-labelledby="t656908"><title id="t656908">Funnel showing illustrative LinkedIn Ads budget math for a B2B company in The Woodlands and Houston</title><defs><linearGradient id="g656908" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar656908" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="469" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="469" rx="22" fill="url(#g656908)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">What $5,000 a month might</tspan><tspan x="36" dy="30">buy</tspan></text><rect x="36" y="120" width="300" height="48" rx="12" fill="#01f6f2" fill-opacity="0.20" stroke="#01f6f2" stroke-opacity="0.60"/><text x="186" y="150" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">Monthly spend</text><text x="354" y="150" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">$5,000</text><rect x="60" y="178" width="252" height="48" rx="12" fill="#01f6f2" fill-opacity="0.18" stroke="#01f6f2" stroke-opacity="0.52"/><text x="186" y="208" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">Clicks at an assumed $12.50</text><text x="354" y="208" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">≈ 400</text><rect x="84" y="236" width="204" height="48" rx="12" fill="#01f6f2" fill-opacity="0.16" stroke="#01f6f2" stroke-opacity="0.43"/><text x="186" y="266" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">Form and site leads</text><text x="354" y="266" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">≈ 30</text><rect x="108" y="294" width="156" height="48" rx="12" fill="#01f6f2" fill-opacity="0.13" stroke="#01f6f2" stroke-opacity="0.35"/><text x="186" y="324" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">Sales-accepted leads</text><text x="354" y="324" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">≈ 8</text><rect x="132" y="352" width="108" height="48" rx="12" fill="#01f6f2" fill-opacity="0.11" stroke="#01f6f2" stroke-opacity="0.26"/><text x="186" y="382" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">New opportunities</text><text x="354" y="382" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">1 to 2</text><text x="36" y="432" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example. Your CPC and rates will</tspan><tspan x="36" dy="16">differ; replace with your own after 30 days.</tspan></text><text x="404" y="448" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>