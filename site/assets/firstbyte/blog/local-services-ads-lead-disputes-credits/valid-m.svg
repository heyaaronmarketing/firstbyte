<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 704" width="440" height="704" role="img" aria-labelledby="t669001"><title id="t669001">Comparison of charged and not charged Local Services Ads leads for Houston and The Woodlands home service businesses</title><defs><linearGradient id="g669001" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar669001" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="703" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="703" rx="22" fill="url(#g669001)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Charged vs. not charged</tspan></text><rect x="36" y="90" width="368" height="276" rx="16" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.09)"/><rect x="36" y="382" width="368" height="276" rx="16" fill="rgba(1,246,242,.05)" stroke="rgba(1,246,242,.45)"/><text x="58" y="128" fill="#cfcad2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600">Not charged</text><path d="M59 145 l8 8 M67 145 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="154" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Spam or duplicate flagged at first</tspan><tspan x="80" dy="18">contact</tspan></text><path d="M59 197 l8 8 M67 197 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="206" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Missed call under 20 seconds</tspan></text><path d="M59 231 l8 8 M67 2