<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" width="440" height="400" role="img" aria-labelledby="t809053"><title id="t809053">Column chart of how sponsorship responses were tracked for a local business in The Woodlands and Houston</title><defs><linearGradient id="g809053" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar809053" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="399" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="399" rx="22" fill="url(#g809053)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Where tracked responses</tspan><tspan x="36" dy="30">came from</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">One season of a single banner sponsorship</tspan></text><line x1="70" x2="404" y1="320.0" y2="320.0" stroke="rgba(255,255,255,.09)"/><line x1="70" x2="404" y1="236.0" y2="236.0" stroke="rgba(255,255,255,.09)"/><line x1="70" x2="404" y1="152.0" y2="152.0" stroke="rgba(255,255,255,.09)"/><text x="56" y="236" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle" transform="rotate(-90 56 236)">% of tracked</text><rect x="82.0" y="262.9" width="42.8" height="57.1" rx="6" fill="url(#bar809053)"/><text x="103.4" y="342" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600">QR scans</text><rect x="148.8" y="299.8" width="42.8" height="20.2" rx="6" fill="rgba(255,255,255,.14)"/><text x="170.2" y="342" text-an