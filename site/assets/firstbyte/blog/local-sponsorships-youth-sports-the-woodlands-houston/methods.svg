<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t809053"><title id="t809053">Column chart of how sponsorship responses were tracked for a local business in The Woodlands and Houston</title><defs><linearGradient id="g809053" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar809053" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="399" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="399" rx="22" fill="url(#g809053)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Where tracked responses came from</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">One season of a single banner sponsorship</tspan></text><line x1="70" x2="764" y1="320.0" y2="320.0" stroke="rgba(255,255,255,.09)"/><line x1="70" x2="764" y1="221.0" y2="221.0" stroke="rgba(255,255,255,.09)"/><line x1="70" x2="764" y1="122.0" y2="122.0" stroke="rgba(255,255,255,.09)"/><text x="56" y="221" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle" transform="rotate(-90 56 221)">% of tracked</text><rect x="95.0" y="252.7" width="88.8" height="67.3" rx="6" fill="url(#bar809053)"/><text x="139.4" y="342" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600">QR scans</text><rect x="233.8" y="296.2" width="88.8" height="23.8" rx="6" fill="rgba(255,255,255,.14)"/><text x="278.2" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Short URL</text><rect x="372.6" y="284.4" width="88.8" height="35.6" rx="6" fill="rgba(255,255,255,.14)"/><text x="417.0" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Call number</text><rect x="511.4" y="292.3" width="88.8" height="27.7" rx="6" fill="rgba(255,255,255,.14)"/><text x="555.8" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Promo code</text><rect x="650.2" y="276.4" width="88.8" height="43.6" rx="6" fill="rgba(255,255,255,.14)"/><text x="694.6" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Asked</text><text x="36" y="378" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example</tspan></text><text x="764" y="378" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>