<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" width="440" height="470" role="img" aria-labelledby="t28538"><title id="t28538">Bar chart of an example 2027 marketing budget split for a Houston small business across capture, create, base and test</title><defs><linearGradient id="g28538" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar28538" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="469" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="469" rx="22" fill="url(#g28538)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">An example budget split</tspan><tspan x="36" dy="30">for a $60,000 year</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Local service business, midpoints of the</tspan><tspan x="36" dy="20">ranges in the table</tspan></text><text x="36" y="184" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">Capture (search, pay-per-lead, SEO)</text><rect x="36" y="192" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="192" width="294.0" height="22" rx="11" fill="url(#bar28538)"/><text x="344" y="208" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$30,000</text><text x="36" y="246" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Create (social, video, mail)</text><rect x="36" y="254" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="254" width="129.4" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="270" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$13,200</text><text x="36" y="308" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Base (site, profile, tracking)</text><rect x="36" y="316" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="316" width="117.6" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="332" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$12,000</text><text x="36" y="370" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Test (one per quarter)</text><rect x="36" y="378" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="378" width="47.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="394" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$4,800</text><text x="36" y="448" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example</tspan></text><text x="404" y="448" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>