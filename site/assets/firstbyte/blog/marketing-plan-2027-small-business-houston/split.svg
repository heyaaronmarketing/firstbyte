<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" width="800" height="356" role="img" aria-labelledby="t28538"><title id="t28538">Bar chart of an example 2027 marketing budget split for a Houston small business across capture, create, base and test</title><defs><linearGradient id="g28538" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar28538" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="355" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="355" rx="22" fill="url(#g28538)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">An example budget split for a $60,000 year</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Local service business, midpoints of the ranges in the table</tspan></text><text x="36" y="128" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="36" dy="0">Capture (search, pay-per-lead,</tspan><tspan x="36" dy="17">SEO)</tspan></text><rect x="300" y="120" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="120" width="380.0" height="22" rx="11" fill="url(#bar28538)"/><text x="694" y="136" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$30,000</text><text x="36" y="182" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">Create (social, video, mail)</tspan></text><rect x="300" y="166" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="166" width="167.2" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="182" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$13,200</text><text x="36" y="228" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">Base (site, profile, tracking)</tspan></text><rect x="300" y="212" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="212" width="152.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="228" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$12,000</text><text x="36" y="274" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">Test (one per quarter)</tspan></text><rect x="300" y="258" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="258" width="60.8" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="274" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$4,800</text><text x="36" y="334" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example</tspan></text><text x="764" y="334" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>