<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 546" width="440" height="546" role="img" aria-labelledby="t815074"><title id="t815074">Checklist of Texas single-skill child care licensing exemption conditions for martial arts after-school programs in Houston and The Woodlands</title><defs><linearGradient id="g815074" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar815074" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="545" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="545" rx="22" fill="url(#g815074)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Texas single-skill</tspan><tspan x="36" dy="30">exemption: every box must</tspan><tspan x="36" dy="30">be checked</tspan></text><text x="36" y="138" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Human Resources Code § 42.041(b)(18),</tspan><tspan x="36" dy="20">paraphrased</tspan></text><rect x="36.0" y="196" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 207.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="212" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Direct instruction in one skill, like</tspan><tspan x="70.0" dy="19">martial arts</tspan></text><rect x="36.0" y="254" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 265.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="270" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">No services unrelated to that skill</tspan></text><rect x="36.0" y="293" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 304.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="309" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Not advertised as child care, day care</tspan><tspan x="70.0" dy="19">or a licensed after-school program</tspan></text><rect x="36.0" y="351" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 362.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="367" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Parents told the program isn&#x27;t</tspan><tspan x="70.0" dy="19">state-licensed</tspan></text><rect x="36.0" y="409" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 420.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="425" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Parents told about the physical risks</tspan></text><rect x="36.0" y="448" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 459.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="464" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">DPS background checks on staff and</tspan><tspan x="70.0" dy="19">volunteers</tspan></text><text x="404" y="524" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>