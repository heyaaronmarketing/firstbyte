<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 609" width="440" height="609" role="img" aria-labelledby="t636939"><title id="t636939">Five-step 90-day med spa marketing plan for The Woodlands and Houston aesthetics practices</title><defs><linearGradient id="g636939" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar636939" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="608" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="608" rx="22" fill="url(#g636939)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A 90-day med spa marketing</tspan><tspan x="36" dy="30">plan</tspan></text><circle cx="58" cy="136" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="141" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="156" y2="213" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="141" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 1-14: Foundation</text><text x="92" y="163" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Treatment pages, provider</tspan><tspan x="92" dy="19">credentials, Business Profile</tspan><tspan x="92" dy="19">services and booking links.</tspan></text><circle cx="58" cy="241" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="246" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="261" y2="299" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="246" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 15-30: Reviews</text><text x="92" y="268" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Review ask at checkout and by text.</tspan><tspan x="92" dy="19">Reply to every one.</tspan></text><circle cx="58" cy="327" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="332" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="347" y2="385" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="332" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 31-60: Search</text><text x="92" y="354" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Treatment-term campaigns with tight</tspan><tspan x="92" dy="19">radius and negatives.</tspan></text><circle cx="58" cy="413" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="418" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="433" y2="471" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="418" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 45-75: Creators</text><text x="92" y="440" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Three to five local creators,</tspan><tspan x="92" dy="19">disclosed, content run as ads.</tspan></text><circle cx="58" cy="499" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="504" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="504" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 60-90: Retention</text><text x="92" y="526" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Membership offer, rebook reminders,</tspan><tspan x="92" dy="19">monthly email.</tspan></text><text x="404" y="587" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>