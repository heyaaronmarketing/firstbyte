<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 635" width="440" height="635" role="img" aria-labelledby="t591401"><title id="t591401">Steps to diagnose a disabled Meta ad account in Business Support Home for Houston and The Woodlands businesses</title><defs><linearGradient id="g591401" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar591401" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="634" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="634" rx="22" fill="url(#g591401)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">The first 30 minutes after</tspan><tspan x="36" dy="30">a disable</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Inside Meta Business Support Home</tspan></text><circle cx="58" cy="162" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="167" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="182" y2="220" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="167" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Open Business Support Home</text><text x="92" y="189" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">facebook.com/business-support-home,</tspan><tspan x="92" dy="19">set the range to 90 days.</tspan></text><circle cx="58" cy="248" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="253" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="268" y2="325" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="253" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Find the asset</text><text x="92" y="275" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Recent account issues, Outstanding</tspan><tspan x="92" dy="19">tab. Ad account, Page, profile or</tspan><tspan x="92" dy="19">portfolio?</tspan></text><circle cx="58" cy="353" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="358" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="373" y2="411" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="358" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Record the reason</text><text x="92" y="380" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Screenshot the reason, asset ID and</tspan><tspan x="92" dy="19">date.</tspan></text><circle cx="58" cy="439" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="444" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="459" y2="497" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="444" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Fix what you can</text><text x="92" y="466" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Pay the balance, secure logins,</tspan><tspan x="92" dy="19">finish verification.</tspan></text><circle cx="58" cy="525" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="530" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="530" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Then request review</text><text x="92" y="552" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">One request, from an admin, with a</tspan><tspan x="92" dy="19">short factual note.</tspan></text><text x="404" y="613" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>