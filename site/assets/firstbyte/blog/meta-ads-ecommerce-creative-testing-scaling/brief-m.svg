<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 722" width="440" height="722" role="img" aria-labelledby="t627192"><title id="t627192">Six-step creative brief template for Meta ads testing for eCommerce brands, from First Byte in Houston and The Woodlands</title><defs><linearGradient id="g627192" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar627192" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="721" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="721" rx="22" fill="url(#g627192)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">The one-page creative</tspan><tspan x="36" dy="30">brief</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Fill this in before anything gets shot or</tspan><tspan x="36" dy="20">edited</tspan></text><circle cx="58" cy="182" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="187" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="202" y2="240" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="187" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Concept and angle</text><text x="92" y="209" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">One sentence: the idea, and which</tspan><tspan x="92" dy="19">customer it speaks to.</tspan></text><circle cx="58" cy="268" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="273" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="288" y2="326" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="273" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Hypothesis</text><text x="92" y="295" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">What it should beat, on which</tspan><tspan x="92" dy="19">metric, and why we think so.</tspan></text><circle cx="58" cy="354" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="359" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="374" y2="412" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="359" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Hook options</text><text x="92" y="381" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Two to four first-three-second</tspan><tspan x="92" dy="19">openers, written out.</tspan></text><circle cx="58" cy="440" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="445" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="460" y2="498" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="445" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Body and proof</text><text x="92" y="467" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Demo, testimonial, claim support,</tspan><tspan x="92" dy="19">offer, call to action.</tspan></text><circle cx="58" cy="526" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="531" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><line x1="58" x2="58" y1="546" y2="584" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="531" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Specs</text><text x="92" y="553" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Formats (9:16, 4:5, 1:1), lengths,</tspan><tspan x="92" dy="19">captions, usage rights.</tspan></text><circle cx="58" cy="612" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="617" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">6</text><text x="92" y="617" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Success rule</text><text x="92" y="639" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Kill, iterate or graduate thresholds</tspan><tspan x="92" dy="19">for this test.</tspan></text><text x="404" y="700" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>