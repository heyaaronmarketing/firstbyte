<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 616" width="440" height="616" role="img" aria-labelledby="t62749"><title id="t62749">Steps for fast quote response that helps moving companies in Houston and The Woodlands book more moves</title><defs><linearGradient id="g62749" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar62749" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="615" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="615" rx="22" fill="url(#g62749)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">From quote request to</tspan><tspan x="36" dy="30">booked move</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">A fast-response setup for a local mover</tspan></text><circle cx="58" cy="162" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="167" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="182" y2="220" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="167" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Instant text</text><text x="92" y="189" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Auto-reply within a minute with the</tspan><tspan x="92" dy="19">coordinator’s name.</tspan></text><circle cx="58" cy="248" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="253" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="268" y2="306" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="253" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Call in 5 minutes</text><text x="92" y="275" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">During business hours, a person</tspan><tspan x="92" dy="19">calls right away.</tspan></text><circle cx="58" cy="334" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="339" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="354" y2="392" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="339" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Video survey</text><text x="92" y="361" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Five-minute walkthrough instead of a</tspan><tspan x="92" dy="19">phone guess.</tspan></text><circle cx="58" cy="420" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="425" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="440" y2="478" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="425" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Written price</text><text x="92" y="447" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Binding or not-to-exceed proposal</tspan><tspan x="92" dy="19">the same day.</tspan></text><circle cx="58" cy="506" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="511" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="511" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Follow-up</text><text x="92" y="533" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Text at 24 hours and 3 days if they</tspan><tspan x="92" dy="19">haven’t booked.</tspan></text><text x="404" y="594" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>