<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 512" width="440" height="512" role="img" aria-labelledby="t74092"><title id="t74092">Bar chart of lesson room fill rates by time block at a music school in The Woodlands or Houston</title><defs><linearGradient id="g74092" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar74092" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="511" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="511" rx="22" fill="url(#g74092)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Lesson room fill rate by</tspan><tspan x="36" dy="30">time block</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">A five-room music school, one typical week</tspan></text><text x="36" y="164" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Weekdays 3:30 to 7:30 p.m.</text><rect x="36" y="172" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="172" width="294.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="188" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">96%</text><text x="36" y="226" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Saturday morning</text><rect x="36" y="234" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="234" width="275.6" height="22" rx="11" fill="rgba(255,255,