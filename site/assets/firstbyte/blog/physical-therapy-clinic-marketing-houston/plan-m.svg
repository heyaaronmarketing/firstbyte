<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 692" width="440" height="692" role="img" aria-labelledby="t44063"><title id="t44063">Ninety-day marketing plan steps for a physical therapy clinic in Houston and The Woodlands</title><defs><linearGradient id="g44063" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar44063" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="691" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="691" rx="22" fill="url(#g44063)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">First 90 days for a PT</tspan><tspan x="36" dy="30">clinic</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Fix the base, then add paid reach</tspan></text><circle cx="58" cy="162" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="167" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="182" y2="239" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="167" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 1-15: tracking</text><text x="92" y="189" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Call tracking, pixel cleanup,</tspan><tspan x="92" dy="19">offline eval imports, one funnel</tspan><tspan x="92" dy="19">report.</tspan></text><circle cx="58" cy="267" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="272" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="287" y2="344" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="272" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 1-30: profile and intake</text><text x="92" y="294" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Business Profile categories and</tspan><tspan x="92" dy="19">services, 48-hour first visit,</tspan><tspan x="92" dy="19">same-day insurance checks.</tspan></text><circle cx="58" cy="372" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="377" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="392" y2="449" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="377" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 15-45: referrals</text><text x="92" y="399" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Referral counts by physician, an</tspan><tspan x="92" dy="19">owner for each office, faster</tspan><tspan x="92" dy="19">post-op scheduling.</tspan></text><circle cx="58" cy="477" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="482" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="497" y2="535" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="482" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 30-60: pages</text><text x="92" y="504" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Four to six condition pages and a</tspan><tspan x="92" dy="19">page per location.</tspan></text><circle cx="58" cy="563" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="568" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="568" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 45-90: ads</text><text x="92" y="590" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Condition search campaigns, LSA</tspan><tspan x="92" dy="19">test, budget moved toward the lowest</tspan><tspan x="92" dy="19">cost per eval.</tspan></text><text x="404" y="670" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>