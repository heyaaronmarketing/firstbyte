<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 626" width="440" height="626" role="img" aria-labelledby="t884996"><title id="t884996">Bar chart of 2024 average plastic surgeon fee ranges by procedure for plastic surgeon marketing in Houston</title><defs><linearGradient id="g884996" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar884996" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="625" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="625" rx="22" fill="url(#g884996)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Average surgeon fee</tspan><tspan x="36" dy="30">ranges, 2024</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">ASPS member survey, surgeon fee only (bar</tspan><tspan x="36" dy="20">shows top of range)</tspan></text><text x="36" y="184" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Facelift</text><rect x="36" y="192" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="192" width="294.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="208" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$12,000-$19,000</text><text x="36" y="246" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">Tummy tuck</text><rect x="36" y="254" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="254" widt