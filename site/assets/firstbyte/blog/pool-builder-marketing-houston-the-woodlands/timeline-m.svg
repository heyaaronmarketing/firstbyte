<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 674" width="440" height="674" role="img" aria-labelledby="t582901"><title id="t582901">Step timeline showing how a pool in The Woodlands must be signed in late fall to be ready by Memorial Day</title><defs><linearGradient id="g582901" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar582901" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="673" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="673" rx="22" fill="url(#g582901)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Working back from a</tspan><tspan x="36" dy="30">Memorial Day swim</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">A typical schedule for a gunite pool in The</tspan><tspan x="36" dy="20">Woodlands</tspan></text><circle cx="58" cy="182" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="187" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="202" y2="259" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="187" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Nov to Dec: design and sign</text><text x="92" y="209" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Consult, 3D design, price and</tspan><tspan x="92" dy="19">contract. This is when your ads need</tspan><tspan x="92" dy="19">to be running.</tspan></text><circle cx="58" cy="287" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="292" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="307" y2="364" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="292" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Dec to Jan: HOA and permits</text><text x="92" y="314" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Residential Design Review Committee</tspan><tspan x="92" dy="19">approval in The Woodlands, plus city</tspan><tspan x="92" dy="19">or county permits.</tspan></text><circle cx="58" cy="392" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="397" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="412" y2="450" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="397" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Jan to Feb: dig, steel and plumbing</text><text x="92" y="419" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Excavation, rebar and plumbing, with</tspan><tspan x="92" dy="19">Houston winter rain delays built in.</tspan></text><circle cx="58" cy="478" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="483" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="498" y2="536" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="483" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Feb to Mar: gunite, tile and coping</text><text x="92" y="505" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Shell sprayed and cured, then tile,</tspan><tspan x="92" dy="19">coping and decking.</tspan></text><circle cx="58" cy="564" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="569" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="569" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Apr to May: plaster and startup</text><text x="92" y="591" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Interior finish, fill, chemical</tspan><tspan x="92" dy="19">startup and the first swim.</tspan></text><text x="404" y="652" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>