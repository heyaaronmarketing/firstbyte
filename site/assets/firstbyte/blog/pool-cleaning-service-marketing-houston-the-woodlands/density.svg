<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-labelledby="t131537"><title id="t131537">Bar chart showing how route density changes daily pool stops for pool service companies in Houston and The Woodlands</title><defs><linearGradient id="g131537" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar131537" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="309" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="309" rx="22" fill="url(#g131537)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Same route, different density</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Stops per day a tech can finish</tspan></text><text x="36" y="128" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="36" dy="0">Tight clusters (avg 4 min between</tspan><tspan x="36" dy="17">stops)</tspan></text><rect x="300" y="120" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="120" width="380.0" height="22" rx="11" fill="url(#bar131537)"/><text x="694" y="136" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">18</text><text x="36" y="182" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">Mixed clusters (avg 10 min)</tspan></text><rect x="300" y="166" width="380" height="22" rx="11" fill="rgba(255,25