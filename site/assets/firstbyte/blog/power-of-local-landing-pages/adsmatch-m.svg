<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 552" width="440" height="552" role="img" aria-labelledby="t428909"><title id="t428909">Funnel showing how a Google search for a Katy service flows to a local landing page and a phone call in Houston</title><defs><linearGradient id="g428909" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar428909" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="551" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="551" rx="22" fill="url(#g428909)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Message match from search</tspan><tspan x="36" dy="30">to call</tspan></text><rect x="36" y="120" width="368" height="64" rx="12" fill="#01f6f2" fill-opacity="0.20" stroke="#01f6f2" stroke-opacity="0.60"/><text x="220" y="146" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="220" dy="0">Search: “drain cleaning Katy”</tspan></text><text x="220" y="168" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">Intent</text><rect x="45" y="192" width="350" height="64" rx="12" fill="#01f6f2" fill-opacity="0.18" stroke="#01f6f2" stroke-opacity="0.53"/><text x="220" y="218" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="220" dy="0">Ad headline names Katy and the service</tspan></text><text x="220" y="240" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">Relevance</text><rect x="54" y="264" width="331" height="82" rx="12" fill="#01f6f2" fill-opacity="0.16" stroke="#01f6f2" stroke-opacity="0.46"/><text x="220" y="290" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="220" dy="0">Lands on the Katy page, not the</tspan><tspan x="220" dy="18">homepage</tspan></text><text x="220" y="330" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">Experience</text><rect x="64" y="354" width="313" height="82" rx="12" fill="#01f6f2" fill-opacity="0.14" stroke="#01f6f2" stroke-opacity="0.38"/><text x="220" y="380" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="220" dy="0">Local proof: jobs, reviews, drive</tspan><tspan x="220" dy="18">time</tspan></text><text x="220" y="420" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">Trust</text><rect x="73" y="444" width="294" height="64" rx="12" fill="#01f6f2" fill-opacity="0.12" stroke="#01f6f2" stroke-opacity="0.31"/><text x="220" y="470" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="220" dy="0">Taps to call</tspan></text><text x="220" y="492" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">Lead</text><text x="404" y="530" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>