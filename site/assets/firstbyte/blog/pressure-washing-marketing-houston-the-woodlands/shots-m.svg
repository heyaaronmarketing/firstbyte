text x="92" y="486" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Note service, surface and</tspan><tspan x="92" dy="19">neighborhood for the caption.</tspan></text><circle cx="58" cy="545" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="550" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="550" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Post and reuse</text><text x="92" y="572" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Profile photos, a Reel, the quote</tspan><tspan x="92" dy="19">follow-up and the door hanger.</tspan></text><text x="404" y="633" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>