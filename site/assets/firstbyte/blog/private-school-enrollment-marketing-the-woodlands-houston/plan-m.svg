<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 561" width="440" height="561" role="img" aria-labelledby="t63001"><title id="t63001">Ninety-day private school enrollment marketing plan for schools in The Woodlands and Houston</title><defs><linearGradient id="g63001" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar63001" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="560" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="560" rx="22" fill="url(#g63001)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A first 90 days of</tspan><tspan x="36" dy="30">enrollment marketing</tspan></text><circle cx="58" cy="136" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="141" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="156" y2="213" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="141" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 1-15</text><text x="92" y="163" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Tracked numbers, form sources, tour</tspan><tspan x="92" dy="19">booking online, open house dates</tspan><tspan x="92" dy="19">published.</tspan></text><circle cx="58" cy="241" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="246" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="261" y2="318" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="246" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 15-30</text><text x="92" y="268" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Claim GreatSchools and Niche,</tspan><tspan x="92" dy="19">refresh Google Business Profile,</tspan><tspan x="92" dy="19">start review requests.</tspan></text><circle cx="58" cy="346" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="351" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="366" y2="404" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="351" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 30-60</text><text x="92" y="373" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Launch search campaigns by division</tspan><tspan x="92" dy="19">and open house ads on Meta.</tspan></text><circle cx="58" cy="432" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="437" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><text x="92" y="437" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 60-90</text><text x="92" y="459" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Tour follow-up sequence,</tspan><tspan x="92" dy="19">retargeting, first funnel report by</tspan><tspan x="92" dy="19">source.</tspan></text><text x="404" y="539" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>