<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 417" width="800" height="417" role="img" aria-labelledby="t63001"><title id="t63001">Ninety-day private school enrollment marketing plan for schools in The Woodlands and Houston</title><defs><linearGradient id="g63001" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar63001" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="416" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="416" rx="22" fill="url(#g63001)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A first 90 days of enrollment marketing</tspan></text><circle cx="58" cy="106" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="111" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="126" y2="145" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="111" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 1-15</text><text x="92" y="133" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Tracked numbers, form sources, tour booking online, open house dates published.</tspan></text><circle cx="58" cy="173" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="178" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="193" y2="231" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="178" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 15-30</text><text x="92" y="200" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Claim GreatSchools and Niche, refresh Google Business Profile, start review</tspan><tspan x="92" dy="19">requests.</tspan></text><circle cx="58" cy="259" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="264" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="279" y2="298" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="264" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 30-60</text><text x="92" y="286" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Launch search campaigns by division and open house ads on Meta.</tspan></text><circle cx="58" cy="326" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="331" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><text x="92" y="331" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 60-90</text><text x="92" y="353" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Tour follow-up sequence, retargeting, first funnel report by source.</tspan></text><text x="764" y="395" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>