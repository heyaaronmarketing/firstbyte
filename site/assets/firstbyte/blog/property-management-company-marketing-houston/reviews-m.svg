<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 627" width="440" height="627" role="img" aria-labelledby="t549982"><title id="t549982">Steps a Houston property management company can take to improve Google reviews within Google policy</title><defs><linearGradient id="g549982" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar549982" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="626" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="626" rx="22" fill="url(#g549982)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Raising a property</tspan><tspan x="36" dy="30">manager’s rating,</tspan><tspan x="36" dy="30">legitimately</tspan></text><text x="36" y="138" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">What stays inside Google’s rules</tspan></text><circle cx="58" cy="192" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="197" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="212" y2="250" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="197" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Ask every owner</text><text x="92" y="219" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Same link at onboarding and after a</tspan><tspan x="92" dy="19">lease is signed.</tspan></text><circle cx="58" cy="278" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="283" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="298" y2="336" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="283" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Ask every tenant</text><text x="92" y="305" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">At move-in and after a repair is</tspan><tspan x="92" dy="19">closed.</tspan></text><circle cx="58" cy="364" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="369" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="384" y2="403" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="369" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Reply to all</text><text x="92" y="391" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Calm, specific, no private details.</tspan></text><circle cx="58" cy="431" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="436" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="451" y2="489" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="436" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Fix root causes</text><text x="92" y="458" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Photo-backed deposit itemization,</tspan><tspan x="92" dy="19">faster repairs.</tspan></text><circle cx="58" cy="517" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="522" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="522" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Report violations only</text><text x="92" y="544" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Harassment and off-topic reviews,</tspan><tspan x="92" dy="19">nothing else.</tspan></text><text x="404" y="605" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>