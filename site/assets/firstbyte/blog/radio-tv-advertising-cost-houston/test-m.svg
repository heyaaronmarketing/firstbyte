<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 674" width="440" height="674" role="img" aria-labelledby="t208331"><title id="t208331">Five steps for testing radio advertising in Houston, from fixing search to tracking a four to eight week flight</title><defs><linearGradient id="g208331" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar208331" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="673" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="673" rx="22" fill="url(#g208331)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">How we run a first radio</tspan><tspan x="36" dy="30">or TV test</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Our order of operations for a Houston-area</tspan><tspan x="36" dy="20">business</tspan></text><circle cx="58" cy="182" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="187" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="202" y2="259" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="187" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Fix the landing spot</text><text x="92" y="209" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Make sure search ads, your Business</tspan><tspan x="92" dy="19">Profile and site catch people who</tspan><tspan x="92" dy="19">look you up.</tspan></text><circle cx="58" cy="287" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="292" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="307" y2="364" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="292" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Pick one channel</text><text x="92" y="314" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Start with streaming audio or CTV</tspan><tspan x="92" dy="19">unless most of the metro could buy</tspan><tspan x="92" dy="19">from you.</tspan></text><circle cx="58" cy="392" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="397" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="412" y2="450" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="397" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Get CPM quotes</text><text x="92" y="419" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Ask each rep for cost per thousand</tspan><tspan x="92" dy="19">in your target age group, by week.</tspan></text><circle cx="58" cy="478" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="483" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="498" y2="536" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="483" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Build tracking first</text><text x="92" y="505" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Dedicated number, vanity URL, offer</tspan><tspan x="92" dy="19">code and a branded search baseline.</tspan></text><circle cx="58" cy="564" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="569" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="569" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Run 4 to 8 weeks</text><text x="92" y="591" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Hold frequency near three a week,</tspan><tspan x="92" dy="19">then compare to the weeks before.</tspan></text><text x="404" y="652" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>