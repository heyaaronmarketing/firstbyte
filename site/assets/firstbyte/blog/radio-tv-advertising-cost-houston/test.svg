<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510" role="img" aria-labelledby="t208331"><title id="t208331">Five steps for testing radio advertising in Houston, from fixing search to tracking a four to eight week flight</title><defs><linearGradient id="g208331" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar208331" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="509" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="509" rx="22" fill="url(#g208331)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">How we run a first radio or TV test</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Our order of operations for a Houston-area business</tspan></text><circle cx="58" cy="132" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="137" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="152" y2="190" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="137" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Fix the landing spot</text><text x="92" y="159" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Make sure search ads, your Business Profile and site catch people who look you</tspan><tspan x="92" dy="19">up.</tspan></text><circle cx="58" cy="218" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="223" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="238" y2="257" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="223" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Pick one channel</text><text x="92" y="245" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Start with streaming audio or CTV unless most of the metro could buy from you.</tspan></text><circle cx="58" cy="285" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="290" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="305" y2="324" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="290" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Get CPM quotes</text><text x="92" y="312" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Ask each rep for cost per thousand in your target age group, by week.</tspan></text><circle cx="58" cy="352" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="357" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="372" y2="391" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="357" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Build tracking first</text><text x="92" y="379" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Dedicated number, vanity URL, offer code and a branded search baseline.</tspan></text><circle cx="58" cy="419" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="424" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="424" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Run 4 to 8 weeks</text><text x="92" y="446" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Hold frequency near three a week, then compare to the weeks before.</tspan></text><text x="764" y="488" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>