<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 448" width="800" height="448" role="img" aria-labelledby="t242671"><title id="t242671">Bar chart of how much a TV commercial costs in Houston on KTRK by daypart, from overnight to primetime</title><defs><linearGradient id="g242671" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar242671" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="447" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="447" rx="22" fill="url(#g242671)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">What a :30 cost on KTRK in early 2024</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Top of each daypart’s range, from an FCC public file invoice</tspan></text><text x="36" y="136" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">Overnight</tspan></text><rect x="300" y="120" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="120" width="19.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="136" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$50–$175</text><text x="36" y="182" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">Daytime talk</tspan></text><rect x="300" y="166" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="166" width="43.4" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="182" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$200–$400</text><text x="36" y="228" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">Good Morning America</tspan></text><rect x="300" y="212" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="212" width="86.9" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="228" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$700–$800</text><text x="36" y="274" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">5 and 6 p.m. news</tspan></text><rect x="300" y="258" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="258" width="130.3" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="274" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$800–$1,200</text><text x="36" y="320" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="36" dy="0">10 p.m. news</tspan></text><rect x="300" y="304" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="304" width="152.0" height="22" rx="11" fill="url(#bar242671)"/><text x="694" y="320" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$1,300–$1,400</text><text x="36" y="366" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">Primetime shows</tspan></text><rect x="300" y="350" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="350" width="380.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="366" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$2,000–$3,500</text><text x="36" y="426" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Source: KTRK invoice, FCC public inspection file, Feb 2024</tspan></text><text x="764" y="426" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>