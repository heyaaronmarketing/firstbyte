<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t4824"><title id="t4824">Column chart of map pack grid rank improvement for a local business in The Woodlands and Houston over five months</title><defs><linearGradient id="g4824" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar4824" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="399" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="399" rx="22" fill="url(#g4824)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Share of grid points in the top 3</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">7x7 rank grid for one keyword, month by month</tspan></text><line x1="70" x2="764" y1="320.0" y2="320.0" stroke="rgba(255,255,255,.09)"/><line x1="70" x2="764" y1="221.0" y2="221.0" stroke="rgba(255,255,255,.09)"/><line x1="70" x2="764" y1="122.0" y2="122.0" stroke="rgba(255,255,255,.09)"/><text x="56" y="221" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle" transform="rotate(-90 56 221)">% of grid in top 3</text><rect x="90.8" y="284.4" width="74.0" height="35.6" rx="6" fill="rgba(255,255,255,.14)"/><text x="127.8" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Start</text><rect x="206.5" y="276.4" width="74.0" height="43.6" rx="6" fill="rgba(255,255,255,.14)"/><text x="243.5" y="342" text-anchor="middle" fill