<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 613" width="440" height="613" role="img" aria-labelledby="t67244"><title id="t67244">Checklist of TREC and Fair Housing advertising rules for real estate Facebook ads in Houston and The Woodlands</title><defs><linearGradient id="g67244" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar67244" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="612" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="612" rx="22" fill="url(#g67244)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Before any real estate ad</tspan><tspan x="36" dy="30">goes live</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">A quick TREC, Fair Housing and Meta check for</tspan><tspan x="36" dy="20">Texas agents</tspan></text><rect x="36.0" y="166" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 177.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="182" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Broker name at least half the size of</tspan><tspan x="70.0" dy="19">your contact info</tspan></text><rect x="36.0" y="224" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 235.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="240" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Team name ends in team or group</tspan></text><rect x="36.0" y="263" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 274.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="279" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Meta campaign set to the Housing</tspan><tspan x="70.0" dy="19">special ad category</tspan></text><rect x="36.0" y="321" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 332.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="337" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">No ZIP targeting, full age range, all</tspan><tspan x="70.0" dy="19">genders</tspan></text><rect x="36.0" y="379" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 390.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="395" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Copy describes the home, not who should</tspan><tspan x="70.0" dy="19">live there</tspan></text><rect x="36.0" y="437" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 448.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="453" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Only claim sold if you worked the deal</tspan></text><rect x="36.0" y="476" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 487.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="492" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Homepage links to IABS and Consumer</tspan><tspan x="70.0" dy="19">Protection Notice</tspan></text><rect x="36.0" y="534" width="22" height="22" rx="7" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><path d="M42.0 545.5 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="550" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14.5"><tspan x="70.0" dy="0">Sponsoring broker has reviewed it</tspan></text><text x="404" y="591" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>