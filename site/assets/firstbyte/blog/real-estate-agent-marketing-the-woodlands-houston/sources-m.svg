<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 590" width="440" height="590" role="img" aria-labelledby="t507465"><title id="t507465">Bar chart of how home buyers found their real estate agent, relevant to real estate leads in Houston</title><defs><linearGradient id="g507465" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar507465" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="589" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="589" rx="22" fill="url(#g507465)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">How buyers found their</tspan><tspan x="36" dy="30">agent</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Share of all buyers, 2025</tspan></text><text x="36" y="164" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">Referral from friend or family</text><rect x="36" y="172" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="172" width="294.0" height="22" rx="11" fill="url(#bar507465)"/><text x="344" y="188" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">43%</text><text x="36" y="226" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">Agent they used before</text><rect x="36" y="234" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="234" width="102.6" height="22" rx="11" fill="url(#bar507465)"/><text