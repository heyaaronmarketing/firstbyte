="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="350" width="46.6" height="22" rx="11" fill="url(#bar494100)"/><text x="694" y="366" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$1.47</text><text x="36" y="426" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Source: DoorDash and Uber Eats merchant pricing pages; direct row uses ChowNow’s 2.95% + $0.29</tspan></text><text x="764" y="426" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>