<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 537" width="440" height="537" role="img" aria-labelledby="t601405"><title id="t601405">Stat tiles showing how diners use reviews and social media to choose restaurants in The Woodlands and Houston</title><defs><linearGradient id="g601405" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar601405" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="536" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="536" rx="22" fill="url(#g601405)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">How diners decide before</tspan><tspan x="36" dy="30">they arrive</tspan></text><rect x="36" y="120" width="368" height="76" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="171" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">97%</text><text x="186" y="154" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">read reviews for local</tspan><tspan x="186" dy="19">businesses</tspan></text><rect x="36" y="208" width="368" height="76" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="259" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">74%</text><text x="186" y="242" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">look for reviews from the</tspan><tspan x="186" dy="19">last 3 months</tspan></text><rect x="36" y="296" width="368" height="76" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="347" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">31%</text><text x="186" y="330" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">only use businesses rated</tspan><tspan x="186" dy="19">4.5+ stars</tspan></text><rect x="36" y="384" width="368" height="87" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="440" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">50%</text><text x="186" y="414" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">of diners say social media</tspan><tspan x="186" dy="19">helped them find a</tspan><tspan x="186" dy="19">restaurant</tspan></text><text x="36" y="499" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Source: BrightLocal 2026 Local Consumer Review</tspan><tspan x="36" dy="16">Survey; Toast</tspan></text><text x="404" y="515" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>