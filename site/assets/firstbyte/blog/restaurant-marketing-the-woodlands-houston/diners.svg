<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 293" width="800" height="293" role="img" aria-labelledby="t601405"><title id="t601405">Stat tiles showing how diners use reviews and social media to choose restaurants in The Woodlands and Houston</title><defs><linearGradient id="g601405" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar601405" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="292" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="292" rx="22" fill="url(#g601405)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">How diners decide before they arrive</tspan></text><rect x="36" y="90" width="170" height="153" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="148" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">97%</text><text x="56" y="178" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="56" dy="0">read reviews for</tspan><tspan x="56" dy="19">local businesses</tspan></text><rect x="222" y="90" width="170" height="153" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="242" y="148" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">74%</text><text x="242" y="178" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="242" dy="0">look for reviews</tspan><tspan x="242" dy="19">from the last 3</tspan><tspan x="242" dy="19">months</tspan></text><rect x="408" y="90" width="170" height="153" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="428" y="148" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">31%</text><text x="428" y="178" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="428" dy="0">only use businesses</tspan><tspan x="428" dy="19">rated 4.5+ stars</tspan></text><rect x="594" y="90" width="170" height="153" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="614" y="148" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">50%</text><text x="614" y="178" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="614" dy="0">of diners say social</tspan><tspan x="614" dy="19">media helped them</tspan><tspan x="614" dy="19">find a restaurant</tspan></text><text x="36" y="271" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Source: BrightLocal 2026 Local Consumer Review Survey; Toast</tspan></text><text x="764" y="271" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>