<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 402" width="800" height="402" role="img" aria-labelledby="t882581"><title id="t882581">Bar chart comparing delivery app commissions with direct online ordering costs for Houston restaurants on a $40 order</title><defs><linearGradient id="g882581" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar882581" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="401" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="401" rx="22" fill="url(#g882581)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">What a $40 delivery order costs you</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Platform commission on one order, by plan</tspan></text><text x="36" y="136" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">DoorDash Basic (15%)</tspan></text><rect x="300" y="120" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="120" width="190.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="136" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$6.00</text><text x="36" y="182" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">Uber Eats Lite (20%)</tspan></text><rect x="300" y="166" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="166" width="253.3" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="182" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$8.00</text><text x="36" y="228" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">DoorDash or Uber Plus (25%)</tspan></text><rect x="300" y="212" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="212" width="316.7" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="228" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$10.00</text><text x="36" y="266" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">DoorDash Premier or Uber Premium</tspan><tspan x="36" dy="17">(30%)</tspan></text><rect x="300" y="258" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="258" width="380.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="274" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$12.00</text><text x="36" y="312" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="36" dy="0">Your own online ordering (about 3%</tspan><tspan x="36" dy="17">processing)</tspan></text><rect x="300" y="304" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="304" width="38.0" height="22" rx="11" fill="url(#bar882581)"/><text x="694" y="320" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">about $1.20</text><text x="36" y="380" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Source: DoorDash and Uber Eats published rates; 3% processing is an assumption</tspan></text><text x="764" y="380" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>