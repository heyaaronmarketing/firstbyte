<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 466" width="440" height="466" role="img" aria-labelledby="t923277"><title id="t923277">Bar chart of host payout on a $1,000 short-term rental booking in Houston, Lake Conroe or Galveston by channel: direct, Airbnb and Vrbo</title><defs><linearGradient id="g923277" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar923277" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="465" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="465" rx="22" fill="url(#g923277)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">What a host keeps from a</tspan><tspan x="36" dy="30">$1,000 stay</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Before taxes, cleaning and software costs</tspan></text><text x="36" y="164" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">Direct booking</text><rect x="36" y="172" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="172" width="294.0" height="22" rx="11" fill="url(#bar923277)"/><text x="344" y="188" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$970.70</text><text x="36" y="226" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Airbnb split fee</text><rect x="36" y="234" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="234" width="293.8" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="250" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$970</text><text x="36" y="288" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Vrbo 12%</text><rect x="36" y="296" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="296" width="266.5" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="312" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$880</text><text x="36" y="350" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Airbnb single fee</text><rect x="36" y="358" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="358" width="255.9" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="374" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$845</text><text x="36" y="428" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example. Under the split fee the</tspan><tspan x="36" dy="16">guest also pays a 14.1% to 16.5% service fee.</tspan></text><text x="404" y="444" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>