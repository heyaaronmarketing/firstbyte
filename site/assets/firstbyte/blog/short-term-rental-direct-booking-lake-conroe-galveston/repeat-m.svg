<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 516" width="440" height="516" role="img" aria-labelledby="t856091"><title id="t856091">Funnel showing how short-term rental guests at Lake Conroe or Galveston near Houston turn into repeat direct bookings</title><defs><linearGradient id="g856091" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar856091" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="515" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="515" rx="22" fill="url(#g856091)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">How platform guests become</tspan><tspan x="36" dy="30">direct guests</tspan></text><rect x="36" y="120" width="368" height="64" rx="12" fill="#01f6f2" fill-opacity="0.20" stroke="#01f6f2" stroke-opacity="0.60"/><text x="220" y="146" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="220" dy="0">Books on Airbnb or Vrbo</tspan></text><text x="220" y="168" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">100 stays</text><rect x="45" y="192" width="350" height="64" rx="12" fill="#01f6f2" fill-opacity="0.18" stroke="#01f6f2" stroke-opacity="0.53"/><text x="220" y="218" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="220" dy="0">Remembers your property name</tspan></text><text x="220" y="240" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Displa