<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" width="800" height="466" role="img" aria-labelledby="t102838"><title id="t102838">Comparison of vague and specific website copy for AI search visibility for businesses in Houston and The Woodlands</title><defs><linearGradient id="g102838" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar102838" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="465" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="465" rx="22" fill="url(#g102838)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Copy AI can’t use vs. copy it can quote</tspan></text><rect x="36" y="90" width="354" height="330" rx="16" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.09)"/><rect x="410" y="90" width="354" height="330" rx="16" fill="rgba(1,246,242,.05)" stroke="rgba(1,246,242,.45)"/><text x="58" y="128" fill="#cfcad2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600">Vague</text><path d="M59 145 l8 8 M67 145 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="154" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">“Your trusted local experts”</tspan></text><path d="M59 179 l8 8 M67 179 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="188" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">“Serving the Greater Houston area”</tspan></text><path d="M59 213 l8 8 M67 213 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="222" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">“Quality service at fair prices”</tspan></text><path d="M59 247 l8 8 M67 247 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="256" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Services listed only in an image</tspan></text><path d="M59 281 l8 8 M67 281 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="290" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Hours only on the contact page</tspan><tspan x="80" dy="18">footer</tspan></text><text x="432.0" y="128" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600">Quotable</text><path d="M432.0 150 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="454.0" y="154" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="454.0" dy="0">“Licensed electricians, in Spring</tspan><tspan x="454.0" dy="18">since 2009”</tspan></text><path d="M432.0 202 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="454.0" y="206" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="454.0" dy="0">“Serving The Woodlands, Spring,</tspan><tspan x="454.0" dy="18">Conroe and Tomball”</tspan></text><path d="M432.0 254 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="454.0" y="258" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="454.0" dy="0">“Service calls from $89, credited to</tspan><tspan x="454.0" dy="18">the repair”</tspan></text><path d="M432.0 306 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="454.0" y="310" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="454.0" dy="0">Each service named in text with its</tspan><tspan x="454.0" dy="18">own page</tspan></text><path d="M432.0 358 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="454.0" y="362" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="454.0" dy="0">Hours, including weekends, stated in</tspan><tspan x="454.0" dy="18">plain words</tspan></text><text x="764" y="444" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>