<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 655" width="440" height="655" role="img" aria-labelledby="t349642"><title id="t349642">Five steps showing how ChatGPT and Google AI Mode build answers about Houston and The Woodlands businesses</title><defs><linearGradient id="g349642" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar349642" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="654" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="654" rx="22" fill="url(#g349642)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">How an AI answer gets</tspan><tspan x="36" dy="30">built</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Simplified, based on Google’s description of</tspan><tspan x="36" dy="20">query fan-out</tspan></text><circle cx="58" cy="182" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="187" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="202" y2="240" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="187" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">The prompt</text><text x="92" y="209" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">“Best roofer in The Woodlands who</tspan><tspan x="92" dy="19">works with insurance.”</tspan></text><circle cx="58" cy="268" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="273" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="288" y2="345" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="273" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Fan-out searches</text><text x="92" y="295" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">The tool runs several related</tspan><tspan x="92" dy="19">searches: roofers, reviews,</tspan><tspan x="92" dy="19">insurance, the area.</tspan></text><circle cx="58" cy="373" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="378" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="393" y2="431" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="378" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Retrieval</text><text x="92" y="400" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">It pulls pages, Business Profiles,</tspan><tspan x="92" dy="19">review sites and news it can read.</tspan></text><circle cx="58" cy="459" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="464" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="479" y2="517" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="464" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Selection</text><text x="92" y="486" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">It keeps sources that state facts</tspan><tspan x="92" dy="19">clearly and agree with each other.</tspan></text><circle cx="58" cy="545" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="550" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="550" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">The answer</text><text x="92" y="572" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Two or three names, often with the</tspan><tspan x="92" dy="19">sources linked underneath.</tspan></text><text x="404" y="633" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>