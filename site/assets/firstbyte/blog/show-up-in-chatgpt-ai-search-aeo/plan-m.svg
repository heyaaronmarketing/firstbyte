<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 681" width="440" height="681" role="img" aria-labelledby="t543713"><title id="t543713">Five-step 90-day plan for AEO and AI search visibility for a business in Houston or The Woodlands</title><defs><linearGradient id="g543713" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar543713" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="680" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="680" rx="22" fill="url(#g543713)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A 90-day AEO plan</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">For a single-location Houston-area business</tspan></text><circle cx="58" cy="132" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="137" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="152" y2="209" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="137" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 1-10</text><text x="92" y="159" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Crawler check, Search Console and</tspan><tspan x="92" dy="19">Bing Webmaster Tools, first prompt</tspan><tspan x="92" dy="19">audit.</tspan></text><circle cx="58" cy="237" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="242" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="257" y2="314" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="242" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 10-30</text><text x="92" y="264" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Rewrite homepage, service and area</tspan><tspan x="92" dy="19">pages with plain facts and real</tspan><tspan x="92" dy="19">detail.</tspan></text><circle cx="58" cy="342" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="347" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="362" y2="419" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="347" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 30-45</text><text x="92" y="369" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Complete every Business Profile</tspan><tspan x="92" dy="19">field; start a steady review request</tspan><tspan x="92" dy="19">routine.</tspan></text><circle cx="58" cy="447" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="452" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="467" y2="524" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="452" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 45-75</text><text x="92" y="474" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Add answers to 15 to 30 real</tspan><tspan x="92" dy="19">customer questions; pitch one local</tspan><tspan x="92" dy="19">story.</tspan></text><circle cx="58" cy="552" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="557" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="557" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 75-90</text><text x="92" y="579" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Join or update chamber and</tspan><tspan x="92" dy="19">association listings; rerun the</tspan><tspan x="92" dy="19">prompt audit.</tspan></text><text x="404" y="659" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>