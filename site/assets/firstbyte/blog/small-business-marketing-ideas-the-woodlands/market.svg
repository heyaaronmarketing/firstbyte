<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 255" width="800" height="255" role="img" aria-labelledby="t616007"><title id="t616007">Stat tiles with The Woodlands population, income and household size for small business marketing</title><defs><linearGradient id="g616007" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar616007" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="254" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="254" rx="22" fill="url(#g616007)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">The Woodlands in three numbers</tspan></text><rect x="36" y="90" width="232" height="115" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="148" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">114,436</text><text x="56" y="178" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="56" dy="0">Residents at the 2020 census</tspan></text><rect x="284" y="90" width="232" height="115" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="304" y="148" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">$140,701</text><text x="304" y="178" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="304" dy="0">Median household income</tspan></text><rect x="532" y="90" width="232" height="115" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="552" y="148" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">2.73</text><text x="552" y="178" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="552" dy="0">People per household</tspan></text><text x="36" y="233" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Source: U.S. Census Bureau QuickFacts, The Woodlands CDP</tspan></text><text x="764" y="233" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>