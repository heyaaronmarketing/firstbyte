<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 571" width="440" height="571" role="img" aria-labelledby="t427711"><title id="t427711">Five-step 90-day small business marketing plan for businesses in The Woodlands and Houston</title><defs><linearGradient id="g427711" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar427711" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="570" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="570" rx="22" fill="url(#g427711)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A 90-day plan for three</tspan><tspan x="36" dy="30">ideas</tspan></text><circle cx="58" cy="136" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="141" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="156" y2="194" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="141" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Week 1: Baseline</text><text x="92" y="163" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Write down calls, forms, profile</tspan><tspan x="92" dy="19">actions, reviews and rating.</tspan></text><circle cx="58" cy="222" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="227" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="242" y2="280" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="227" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Weeks 1-2: Set up</text><text x="92" y="249" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Finish the free idea you skipped.</tspan><tspan x="92" dy="19">Get tracking working.</tspan></text><circle cx="58" cy="308" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="313" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="328" y2="366" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="313" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Weeks 3-12: Repeat</text><text x="92" y="335" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Same tasks, same day, every week. No</tspan><tspan x="92" dy="19">switching.</tspan></text><circle cx="58" cy="394" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="399" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="414" y2="452" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="399" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Day 90: Compare</text><text x="92" y="421" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Keep what moved the baseline. Drop</tspan><tspan x="92" dy="19">what didn’t.</tspan></text><circle cx="58" cy="480" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="485" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="485" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Next quarter: Add one</text><text x="92" y="507" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Pick the next idea from the table.</tspan></text><text x="404" y="549" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>