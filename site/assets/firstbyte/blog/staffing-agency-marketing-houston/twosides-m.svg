<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 632" width="440" height="632" role="img" aria-labelledby="t791399"><title id="t791399">Comparison of candidate and client marketing funnels for staffing agency marketing in Houston and The Woodlands</title><defs><linearGradient id="g791399" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar791399" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="631" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="631" rx="22" fill="url(#g791399)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Two audiences, two funnels</tspan></text><rect x="36" y="90" width="368" height="240" rx="16" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.09)"/><rect x="36" y="346" width="368" height="240" rx="16" fill="rgba(1,246,242,.05)" stroke="rgba(1,246,242,.45)"/><text x="58" y="128" fill="#cfcad2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600">Candidates</text><path d="M59 145 l8 8 M67 145 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="154" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Search jobs by role, pay and place</tspan></text><path d="M59 179 l8 8 M67 179 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="188" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Indeed, Meta, Google Jobs, referrals</tspan></text><path d="M59 213 l8 8 M67 213 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="222" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Want pay, shift, start date fast</tspan></text><path d="M59 247 l8 8 M67 247 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="256" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Judge you on callback speed</tspan></text><path d="M59 281 l8 8 M67 281 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="290" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Measured by cost per start</tspan></text><text x="58" y="384" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600">Clients</text><path d="M58 406 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="80" y="410" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Search staffing by industry and city</tspan></text><path d="M58 440 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="80" y="444" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Google, LinkedIn, outreach, referrals</tspan></text><path d="M58 474 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="80" y="478" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Want reliable people quickly</tspan></text><path d="M58 508 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="80" y="512" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Judge you on fill