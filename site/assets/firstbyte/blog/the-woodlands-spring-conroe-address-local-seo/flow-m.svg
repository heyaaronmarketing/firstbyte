<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" width="440" height="470" role="img" aria-labelledby="t511496"><title id="t511496">Funnel of how Google ranks a The Woodlands or Spring business in local search, from address to map pack</title><defs><linearGradient id="g511496" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar511496" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="469" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="469" rx="22" fill="url(#g511496)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">What Google uses to place</tspan><tspan x="36" dy="30">you in local results</tspan></text><rect x="36" y="120" width="172" height="48" rx="12" fill="#01f6f2" fill-opacity="0.20" stroke="#01f6f2" stroke-opacity="0.60"/><text x="122" y="150" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">Your real address or service area</text><text x="226" y="150" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">Sets the pin</text><rect x="50" y="178" width="144" height="48" rx="12" fill="#01f6f2" fill-opacity="0.18" stroke="#01f6f2" stroke-opacity="0.52"/><text x="122" y="208" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">Your category and profile details</text><text x="226" y="208" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">Relevance</text><rect x="64" y="236" width="117" height="48" rx="12" fill="#01f6f2" fill-opacity="0.16" stroke="#01f6f2" stroke-opacity="0.43"/><text x="122" y="266" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">Distance to the searcher</text><text x="226" y="266" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">Biggest local filter</text><rect x="77" y="294" width="89" height="48" rx="12" fill="#01f6f2" fill-opacity="0.13" stroke="#01f6f2" stroke-opacity="0.35"/><text x="122" y="324" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">Reviews, links and citations</text><text x="226" y="324" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">Prominence</text><rect x="91" y="352" width="62" height="48" rx="12" fill="#01f6f2" fill-opacity="0.11" stroke="#01f6f2" stroke-opacity="0.26"/><text x="122" y="382" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">Who shows in the map pack</text><text x="226" y="382" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">The result</text><text x="36" y="432" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Based on Google’s description of relevance,</tspan><tspan x="36" dy="16">distance and prominence</tspan></text><text x="404" y="448" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>