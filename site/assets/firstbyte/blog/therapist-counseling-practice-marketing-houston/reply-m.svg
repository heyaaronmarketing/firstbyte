<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 752" width="440" height="752" role="img" aria-labelledby="t43641"><title id="t43641">Comparison of risky and HIPAA-safer review replies for therapist practice marketing in Houston and The Woodlands</title><defs><linearGradient id="g43641" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar43641" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="751" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="751" rx="22" fill="url(#g43641)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Replying to a therapy</tspan><tspan x="36" dy="30">practice review</tspan></text><rect x="36" y="120" width="368" height="276" rx="16" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.09)"/><rect x="36" y="412" width="368" height="294" rx="16" fill="rgba(1,246,242,.05)" stroke="rgba(1,246,242,.45)"/><text x="58" y="158" fill="#cfcad2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600">Risky reply</text><path d="M59 175 l8 8 M67 175 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="184" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">“We’re sorry your sessions with Dr.</tspan><tspan x="80" dy="18">Lee felt rushed”</tspan></text><path d="M59 227 l8 8 M67 227 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="236" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">“As we discussed at your last</tspan><tspan x="80" dy="18">visit...”</tspan></text><path d="M59 279 l8 8 M67 279 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="288" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Mentions insurance, diagnosis or fees</tspan></text><path d="M59 313 l8 8 M67 313 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="322" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Argues the facts in public</tspan></text><path d="M59 347 l8 8 M67 347 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="356" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Thanks them “for being a client”</tspan></text><text x="58" y="450" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600">Safer reply</text><path d="M58 472 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="80" y="476" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Doesn’t confirm anyone is a client</tspan></text><path d="M58 506 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="80" y="510" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Same short reply for good and bad</tspan><tspan x="80" dy="18">reviews</tspan></text><path d="M58 558 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="80" y="562" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Invites a call to the practice</tspan><tspan x="80" dy="18">director</tspan></text><path d="M58 610 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="80" y="614" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">No clinician names tied to the</tspan><tspan x="80" dy="18">reviewer</tspan></text><path d="M58 662 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="80" y="666" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Reviewed by whoever handles compliance</tspan></text><text x="404" y="730" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>