<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" width="800" height="356" role="img" aria-labelledby="t536409"><title id="t536409">Bar chart of illustrative paid media budgets per touring event city, from a Houston and The Woodlands marketing agency</title><defs><linearGradient id="g536409" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar536409" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="355" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="355" rx="22" fill="url(#g536409)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Paid budget scales with the city</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Example paid media budget per stop from the formula in this section</tspan></text><text x="36" y="136" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="36" dy="0">Large metro, first visit</tspan></text><rect x="300" y="120" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="120" width="380.0" height="22" rx="11" fill="url(#bar536409)"/><text x="694" y="136" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$102,500</text><text x="36" y="182" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">Large metro, return</tspan></text><rect x="300" y="166" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="166" width="263.2" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="182" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$71,000</text><text x="36" y="228" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">Mid-size, first visit</tspan></text><rect x="300" y="212" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="212" width="153.5" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="228" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$41,400</text><text x="36" y="274" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400"><tspan x="36" dy="0">Smaller market, return</tspan></text><rect x="300" y="258" width="380" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="300" y="258" width="65.6" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="694" y="274" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$17,700</text><text x="36" y="334" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example built on a $29 average all-in ticket</tspan></text><text x="764" y="334" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>