<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 532" width="440" height="532" role="img" aria-labelledby="t335419"><title id="t335419">Funnel showing how event ticket purchases drop out of ad platform tracking, from a Houston and The Woodlands marketing agency</title><defs><linearGradient id="g335419" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar335419" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="531" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="531" rx="22" fill="url(#g335419)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Where tracked ticket</tspan><tspan x="36" dy="30">purchases go missing</tspan></text><rect x="36" y="120" width="368" height="64" rx="12" fill="#01f6f2" fill-opacity="0.20" stroke="#01f6f2" stroke-opacity="0.60"/><text x="220" y="146" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="220" dy="0">Orders in the ticketing report</tspan></text><text x="220" y="168" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">1,050</text><rect x="45" y="192" width="350" height="64" rx="12" fill="#01f6f2" fill-opacity="0.18" stroke="#01f6f2" stroke-opacity="0.53"/><text x="220" y="218" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600"><tspan x="220" dy="0">Orders a pixel could see (no blocking)</tspan></text><text x="220" y="240" text-anchor="middle" fill="#01f6f2" font-