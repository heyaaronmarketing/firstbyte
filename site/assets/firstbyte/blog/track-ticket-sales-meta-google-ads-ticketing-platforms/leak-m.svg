<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" width="440" height="470" role="img" aria-labelledby="t235964"><title id="t235964">Funnel showing how event ticket purchases drop out of ad platform tracking, from a Houston and The Woodlands marketing agency</title><defs><linearGradient id="g235964" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar235964" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="469" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="469" rx="22" fill="url(#g235964)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Where tracked ticket</tspan><tspan x="36" dy="30">purchases go missing</tspan></text><rect x="36" y="120" width="276" height="48" rx="12" fill="#01f6f2" fill-opacity="0.20" stroke="#01f6f2" stroke-opacity="0.60"/><text x="174" y="150" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">Orders in the ticketing report</text><text x="330" y="150" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">1,050</text><rect x="58" y="178" width="232" height="48" rx="12" fill="#01f6f2" fill-opacity="0.18" stroke="#01f6f2" stroke-opacity="0.52"/><text x="174" y="208" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">Orders a pixel could see (no blocking)</text><text x="330" y="208" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">about 850</text><rect x="80" y="236" width="188" height="48" rx="12" fill="#01f6f2" fill-opacity="0.16" stroke="#01f6f2" stroke-opacity="0.43"/><text x="174" y="266" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">Seen and inside an attribution window</text><text x="330" y="266" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">about 700</text><rect x="102" y="294" width="144" height="48" rx="12" fill="#01f6f2" fill-opacity="0.13" stroke="#01f6f2" stroke-opacity="0.35"/><text x="174" y="324" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">Credited to Meta click-through</text><text x="330" y="324" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">about 420</text><rect x="124" y="352" width="100" height="48" rx="12" fill="#01f6f2" fill-opacity="0.11" stroke="#01f6f2" stroke-opacity="0.26"/><text x="174" y="382" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">Credited to Google Ads click</text><text x="330" y="382" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">about 240</text><text x="36" y="432" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example. Gaps vary by platform,</tspan><tspan x="36" dy="16">audience and setup.</tspan></text><text x="404" y="448" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>