<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 778" width="440" height="778" role="img" aria-labelledby="t589531"><title id="t589531">Six-phase timeline for trade show marketing in Houston at OTC, Reliant Park and George R. Brown events</title><defs><linearGradient id="g589531" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar589531" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="777" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="777" rx="22" fill="url(#g589531)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Trade show timeline for</tspan><tspan x="36" dy="30">Houston events</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">From 90 days out to 90 days after</tspan></text><circle cx="58" cy="162" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="167" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="182" y2="239" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="167" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">90-60 days out</text><text x="92" y="189" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Pick the show, set goals, build the</tspan><tspan x="92" dy="19">target account list, book space,</tspan><tspan x="92" dy="19">hotels and suites.</tspan></text><circle cx="58" cy="267" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="272" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="287" y2="344" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="272" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">60-30 days out</text><text x="92" y="294" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Personal outreach wave one, booth</tspan><tspan x="92" dy="19">headline and graphics, lead fields</tspan><tspan x="92" dy="19">set up in the app.</tspan></text><circle cx="58" cy="372" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="377" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="392" y2="449" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="377" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">30-7 days out</text><text x="92" y="399" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">LinkedIn ads to matched accounts,</tspan><tspan x="92" dy="19">booking links, staff briefing,</tspan><tspan x="92" dy="19">confirmations.</tspan></text><circle cx="58" cy="477" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="482" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="497" y2="554" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="482" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Show days</text><text x="92" y="504" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Meetings, graded lead capture,</tspan><tspan x="92" dy="19">geo-targeted reminders, nightly lead</tspan><tspan x="92" dy="19">upload.</tspan></text><circle cx="58" cy="582" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="587" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><line x1="58" x2="58" y1="602" y2="640" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="587" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 1-21 after</text><text x="92" y="609" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Same-day emails to A leads, calls,</tspan><tspan x="92" dy="19">recap email, second touches.</tspan></text><circle cx="58" cy="668" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="673" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">6</text><text x="92" y="673" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Days 30-90 after</text><text x="92" y="695" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Nurture B and C leads, report cost</tspan><tspan x="92" dy="19">per lead and pipeline.</tspan></text><text x="404" y="756" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>