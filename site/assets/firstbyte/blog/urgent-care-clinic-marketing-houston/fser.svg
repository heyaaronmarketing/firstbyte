<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 394" width="800" height="394" role="img" aria-labelledby="t257470"><title id="t257470">Comparison of confusing freestanding ER messaging and clear urgent care messaging for Houston urgent care marketing</title><defs><linearGradient id="g257470" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar257470" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="393" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="393" rx="22" fill="url(#g257470)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">What patients need to see from you</tspan></text><rect x="36" y="90" width="354" height="258" rx="16" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.09)"/><rect x="410" y="90" width="354" height="258" rx="16" fill="rgba(1,246,242,.05)" stroke="rgba(1,246,242,.45)"/><text x="58" y="128" fill="#cfcad2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600">What confuses Houston patients</text><path d="M59 145 l8 8 M67 145 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="154" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">ER-looking building, urgent care</tspan><tspan x="80" dy="18">feel</tspan></text><path d="M59 197 l8 8 M67 197 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="206" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">“We accept all insurance” banners</tspan></text><path d="M59 231 l8 8 M67 231 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="240" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Insurer logos with no network detail</tspan></text><path d="M59 265 l8 8 M67 265 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="274" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">No prices anywhere</tspan></text><path d="M59 299 l8 8 M67 299 l-8 8" stroke="#8f8a93" stroke-width="2" stroke-linecap="round"/><text x="80" y="308" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="80" dy="0">Facility fee found on the bill</tspan></text><text x="432.0" y="128" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600">What a clear urgent care shows</text><path d="M432.0 150 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="454.0" y="154" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="454.0" dy="0">“Urgent care, not an emergency room”</tspan></text><path d="M432.0 184 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="454.0" y="188" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="454.0" dy="0">In-network plans listed by name</tspan></text><path d="M432.0 218 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="454.0" y="222" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="454.0" dy="0">Self-pay prices for common visits</tspan></text><path d="M432.0 252 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="454.0" y="256" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="454.0" dy="0">When to go to the ER instead</tspan></text><path d="M432.0 286 l4 4 l7 -8" fill="none" stroke="#01f6f2" stroke-width="2.2" stroke-linecap="round"/><text x="454.0" y="290" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="454.0" dy="0">Wait time and check-in link</tspan></text><text x="764" y="372" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>