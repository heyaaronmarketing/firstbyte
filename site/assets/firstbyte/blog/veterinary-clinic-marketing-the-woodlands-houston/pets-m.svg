<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 496" width="440" height="496" role="img" aria-labelledby="t130061"><title id="t130061">Stats on pet ownership and veterinary visits that shape veterinary clinic marketing in The Woodlands and Houston</title><defs><linearGradient id="g130061" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar130061" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="495" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="495" rx="22" fill="url(#g130061)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Who already has a vet</tspan></text><rect x="36" y="90" width="368" height="76" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="141" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">45.5%</text><text x="186" y="124" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">of U.S. households own a</tspan><tspan x="186" dy="19">dog</tspan></text><rect x="36" y="178" width="368" height="76" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="229" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">86.8%</text><text x="186" y="212" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">of dog owners have a</tspan><tspan x="186" dy="19">regular vet</tspan></text><rect x="36" y="266" width="368" height="76" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="317" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">57.3%</text><text x="186" y="300" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">of cat owners saw a vet</tspan><tspan x="186" dy="19">last year</tspan></text><rect x="36" y="354" width="368" height="76" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="405" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">4%</text><text x="186" y="388" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="186" dy="0">drop in household vet</tspan><tspan x="186" dy="19">spending</tspan></text><text x="36" y="458" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Source: AVMA 2024 Pet Ownership and</tspan><tspan x="36" dy="16">Demographic Sourcebook (preliminary)</tspan></text><text x="404" y="474" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>