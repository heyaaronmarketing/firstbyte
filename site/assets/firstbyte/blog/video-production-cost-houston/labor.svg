<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 274" width="800" height="274" role="img" aria-labelledby="t666261"><title id="t666261">Stats on camera operator and video editor pay behind video production costs in Houston</title><defs><linearGradient id="g666261" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar666261" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="273" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="273" rx="22" fill="url(#g666261)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Who you&#x27;re paying for</tspan></text><rect x="36" y="90" width="232" height="134" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="56" y="148" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">$74,990</text><text x="56" y="178" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="56" dy="0">median pay, camera operators</tspan></text><rect x="284" y="90" width="232" height="134" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="304" y="148" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">$75,420</text><text x="304" y="178" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="304" dy="0">median pay, video editors</tspan></text><rect x="532" y="90" width="232" height="134" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.09)"/><text x="552" y="148" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1">35%</text><text x="552" y="178" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="552" dy="0">of both jobs are</tspan><tspan x="552" dy="19">self-employed</tspan></text><text x="36" y="252" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Source: BLS Occupational Outlook Handbook, May 2025, national</tspan></text><text x="764" y="252" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>