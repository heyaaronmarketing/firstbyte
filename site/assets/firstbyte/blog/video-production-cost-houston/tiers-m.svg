<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 450" width="440" height="450" role="img" aria-labelledby="t896177"><title id="t896177">Bar chart of video production cost tiers in Houston and The Woodlands from phone clips to scripted commercials</title><defs><linearGradient id="g896177" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar896177" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="449" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="449" rx="22" fill="url(#g896177)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Typical video cost tiers</tspan><tspan x="36" dy="30">in Houston</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Top of each planning range, per project</tspan></text><text x="36" y="164" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Phone or UGC clip</text><rect x="36" y="172" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="172" width="8.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="188" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">$0-$300</text><text x="36" y="226" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Freelancer day</text><rect x="36" y="234" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="234" width="9.8" height="22" rx="11" fill="rgba(25