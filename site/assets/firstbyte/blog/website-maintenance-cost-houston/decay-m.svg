<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 636" width="440" height="636" role="img" aria-labelledby="t19160"><title id="t19160">Timeline of what breaks on an unmaintained small business website in Houston and The Woodlands</title><defs><linearGradient id="g19160" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar19160" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="635" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="635" rx="22" fill="url(#g19160)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">How an unmaintained site</tspan><tspan x="36" dy="30">decays</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">A typical WordPress site with no one assigned</tspan><tspan x="36" dy="20">to it</tspan></text><circle cx="58" cy="182" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="187" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="202" y2="240" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="187" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Months 1-3</text><text x="92" y="209" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Looks fine. Plugin updates start</tspan><tspan x="92" dy="19">piling up.</tspan></text><circle cx="58" cy="268" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="273" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="288" y2="326" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="273" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Months 4-6</text><text x="92" y="295" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">A form stops sending after an</tspan><tspan x="92" dy="19">auto-update. Nobody notices.</tspan></text><circle cx="58" cy="354" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="359" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="374" y2="412" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="359" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Months 7-12</text><text x="92" y="381" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Speed slips; an outdated plugin has</tspan><tspan x="92" dy="19">a public vulnerability.</tspan></text><circle cx="58" cy="440" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="445" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="460" y2="498" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="445" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Year 2</text><text x="92" y="467" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Host forces a PHP upgrade. Old theme</tspan><tspan x="92" dy="19">breaks the layout.</tspan></text><circle cx="58" cy="526" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="531" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><text x="92" y="531" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Any time</text><text x="92" y="553" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Hack: spam pages, redirects, a</tspan><tspan x="92" dy="19">Google warning.</tspan></text><text x="36" y="614" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example</tspan></text><text x="404" y="614" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>