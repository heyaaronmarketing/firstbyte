<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 432" width="440" height="432" role="img" aria-labelledby="t937706"><title id="t937706">Illustrative chart of organic traffic after a website redesign with complete 301 redirects in Houston and The Woodlands</title><defs><linearGradient id="g937706" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar937706" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="431" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="431" rx="22" fill="url(#g937706)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A clean redesign, week by</tspan><tspan x="36" dy="30">week</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Weekly organic clicks as a share of pre-launch</tspan><tspan x="36" dy="20">level</tspan></text><line x1="70" x2="404" y1="320.0" y2="320.0" stroke="rgba(255,255,255,.09)"/><line x1="70" x2="404" y1="246.0" y2="246.0" stroke="rgba(255,255,255,.09)"/><line x1="70" x2="404" y1="172.0" y2="172.0" stroke="rgba(255,255,255,.09)"/><text x="56" y="246" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle" transform="rotate(-90 56 246)">% of pre-launch</text><rect x="78.6" y="172.0" width="30.5" height="148.0" rx="6" fill="rgba(255,255,255,.14)"/><text x="93.9" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Pre</text><rect x="126.3" y="189.8" width="30.5" height="130.2" rx="6" fill="rgba(255,255,255,.14)"/><text x="141.6" y="358" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Wk 1</text><rect x="174.0" y="183.8" width="30.5" height="136.2" rx="6" fill="rgba(255,255,255,.14)"/><text x="189.3" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Wk 2</text><rect x="221.7" y="176.4" width="30.5" height="143.6" rx="6" fill="rgba(255,255,255,.14)"/><text x="237.0" y="358" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Wk 3</text><rect x="269.4" y="173.5" width="30.5" height="146.5" rx="6" fill="rgba(255,255,255,.14)"/><text x="284.7" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Wk 4</text><rect x="317.2" y="172.0" width="30.5" height="148.0" rx="6" fill="rgba(255,255,255,.14)"/><text x="332.4" y="358" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Wk 6</text><rect x="364.9" y="172.0" width="30.5" height="148.0" rx="6" fill="url(#bar937706)"/><text x="380.1" y="342" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600">Wk 8</text><text x="36" y="378" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example of a redesign with a full</tspan><tspan x="36" dy="16">redirect map. Without one, the line tends to</tspan><tspan x="36" dy="16">fall and stay down.</tspan></text><text x="404" y="410" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>