<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 416" width="800" height="416" role="img" aria-labelledby="t937706"><title id="t937706">Illustrative chart of organic traffic after a website redesign with complete 301 redirects in Houston and The Woodlands</title><defs><linearGradient id="g937706" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar937706" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="799" height="415" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="799" height="415" rx="22" fill="url(#g937706)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">A clean redesign, week by week</tspan></text><text x="36" y="78" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Weekly organic clicks as a share of pre-launch level</tspan></text><line x1="70" x2="764" y1="320.0" y2="320.0" stroke="rgba(255,255,255,.09)"/><line x1="70" x2="764" y1="221.0" y2="221.0" stroke="rgba(255,255,255,.09)"/><line x1="70" x2="764" y1="122.0" y2="122.0" stroke="rgba(255,255,255,.09)"/><text x="56" y="221" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle" transform="rotate(-90 56 221)">% of pre-launch</text><rect x="87.8" y="122.0" width="63.5" height="198.0" rx="6" fill="rgba(255,255,255,.14)"/><text x="119.6" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Pre</text><rect x="187.0" y="145.8" width="63.5" height="174.2" rx="6" fill="rgba(255,255,255,.14)"/><text x="218.7" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Wk 1</text><rect x="286.1" y="137.8" width="63.5" height="182.2" rx="6" fill="rgba(255,255,255,.14)"/><text x="317.9" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Wk 2</text><rect x="385.3" y="127.9" width="63.5" height="192.1" rx="6" fill="rgba(255,255,255,.14)"/><text x="417.0" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Wk 3</text><rect x="484.4" y="124.0" width="63.5" height="196.0" rx="6" fill="rgba(255,255,255,.14)"/><text x="516.1" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Wk 4</text><rect x="583.6" y="122.0" width="63.5" height="198.0" rx="6" fill="rgba(255,255,255,.14)"/><text x="615.3" y="342" text-anchor="middle" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Wk 6</text><rect x="682.7" y="122.0" width="63.5" height="198.0" rx="6" fill="url(#bar937706)"/><text x="714.4" y="342" text-anchor="middle" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600">Wk 8</text><text x="36" y="378" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Illustrative example of a redesign with a full redirect map. Without one, the line tends to fall and</tspan><tspan x="36" dy="16">stay down.</tspan></text><text x="764" y="394" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>