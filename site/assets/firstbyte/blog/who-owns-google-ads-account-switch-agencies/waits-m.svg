<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 528" width="440" height="528" role="img" aria-labelledby="t657103"><title id="t657103">Bar chart of waiting periods for switching marketing agencies, from phone ports to domain transfer locks</title><defs><linearGradient id="g657103" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar657103" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="527" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="527" rx="22" fill="url(#g657103)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Waiting periods when you</tspan><tspan x="36" dy="30">switch</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Plan your agency exit around these</tspan></text><text x="36" y="164" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Simple phone number port</text><rect x="36" y="172" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="172" width="8.0" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="188" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1 business day</text><text x="36" y="226" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">GBP owner response to access request</text><rect x="36" y="234" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="234" width="14.7" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="250" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3 days</text><text x="36" y="288" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">Registrar must give auth code</text><rect x="36" y="296" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="296" width="24.5" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="312" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5 days</text><text x="36" y="350" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400">New GBP owner before primary transfer</text><rect x="36" y="358" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="358" width="34.3" height="22" rx="11" fill="rgba(255,255,255,.28)"/><text x="344" y="374" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">7 days</text><text x="36" y="412" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">Possible domain transfer lock</text><rect x="36" y="420" width="294" height="22" rx="11" fill="rgba(255,255,255,.05)"/><rect x="36" y="420" width="294.0" height="22" rx="11" fill="url(#bar657103)"/><text x="344" y="436" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">up to 60 days</text><text x="36" y="490" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12"><tspan x="36" dy="0">Source: FCC, Google Business Profile Help,</tspan><tspan x="36" dy="16">ICANN</tspan></text><text x="404" y="506" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 