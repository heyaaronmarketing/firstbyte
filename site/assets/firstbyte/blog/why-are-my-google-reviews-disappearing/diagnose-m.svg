<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 797" width="440" height="797" role="img" aria-labelledby="t719618"><title id="t719618">Six-step diagnostic flow for working out why Google reviews are disappearing from a Houston business profile</title><defs><linearGradient id="g719618" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01f6f2" stop-opacity=".10"/><stop offset=".5" stop-color="#121014" stop-opacity="0"/></linearGradient><linearGradient id="bar719618" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#01f6f2"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="796" rx="22" fill="#121014" stroke="rgba(255,255,255,.18)"/><rect x=".5" y=".5" width="439" height="796" rx="22" fill="url(#g719618)"/><text x="36" y="52" fill="#ffffff" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"><tspan x="36" dy="0">Why did my reviews</tspan><tspan x="36" dy="30">disappear? Check in order</tspan></text><text x="36" y="108" fill="#8f8a93" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="36" dy="0">Most owners find the cause by step four</tspan></text><circle cx="58" cy="162" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="167" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">1</text><line x1="58" x2="58" y1="182" y2="239" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="167" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Rule out a Google bug</text><text x="92" y="189" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Compare counts on Search and Maps,</tspan><tspan x="92" dy="19">and check the Help Community and SEO</tspan><tspan x="92" dy="19">news for same-day reports.</tspan></text><circle cx="58" cy="267" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="272" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">2</text><line x1="58" x2="58" y1="287" y2="344" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="272" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Check your email</text><text x="92" y="294" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Look for a Google restriction notice</tspan><tspan x="92" dy="19">or ask customers about a Review not</tspan><tspan x="92" dy="19">posted email.</tspan></text><circle cx="58" cy="372" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="377" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">3</text><line x1="58" x2="58" y1="392" y2="449" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="377" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Find which reviews went</text><text x="92" y="399" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Compare against last month’s</tspan><tspan x="92" dy="19">screenshot. Look for clusters by</tspan><tspan x="92" dy="19">date, source or reviewer.</tspan></text><circle cx="58" cy="477" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="482" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">4</text><line x1="58" x2="58" y1="497" y2="554" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="482" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Match them to your history</text><text x="92" y="504" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Promotions, staff reviews, kiosks, a</tspan><tspan x="92" dy="19">review vendor or a sudden spike of</tspan><tspan x="92" dy="19">requests.</tspan></text><circle cx="58" cy="582" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="587" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">5</text><line x1="58" x2="58" y1="602" y2="640" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/><text x="92" y="587" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Check for profile changes</text><text x="92" y="609" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Recent merges, duplicate removals,</tspan><tspan x="92" dy="19">address moves or a reinstatement.</tspan></text><circle cx="58" cy="668" r="17" fill="rgba(1,246,242,.12)" stroke="#01f6f2"/><text x="58" y="673" text-anchor="middle" fill="#01f6f2" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">6</text><text x="92" y="673" fill="#ffffff" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700">Act on the cause</text><text x="92" y="695" fill="#cfcad2" font-family="Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="14"><tspan x="92" dy="0">Wait out bugs, stop violations, have</tspan><tspan x="92" dy="19">reviewers appeal, or appeal a</tspan><tspan x="92" dy="19">restriction.</tspan></text><text x="404" y="775" text-anchor="end" fill="#8f8a93" font-family="'Funnel Display', Figtree, 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1">first<tspan fill="#01f6f2">byte</tspan></text></svg>